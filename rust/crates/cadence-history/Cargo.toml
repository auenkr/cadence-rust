[package]
name = "cadence-history"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "cadence-history"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cadence-service-core = { path = "../cadence-service-core" }
cadence-matching = { path = "../cadence-matching" }
cadence-common = { path = "../cadence-common" }
cadence-api = { path = "../cadence-api" }
cadence-proto = { path = "../cadence-proto" }
tonic = { version = "0.12", features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
cadence-persistence = { path = "../cadence-persistence" }
cadence-thrift = { path = "../cadence-thrift" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
futures-util = "0.3"

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
prost = "0.13"
bytes = "1"
tokio-stream = { version = "0.1", features = ["net"] }
crc32fast = "1"
crc32c = "0.6"
rskafka = { version = "0.6", default-features = false, features = ["transport-tls"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
