[package]
name = "cadence-history"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "cadence-history"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cadence-service-core = { path = "../cadence-service-core" }
cadence-matching = { path = "../cadence-matching" }
cadence-common = { path = "../cadence-common" }
cadence-api = { path = "../cadence-api" }
cadence-persistence = { path = "../cadence-persistence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
async-trait = "0.1"
futures-util = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
