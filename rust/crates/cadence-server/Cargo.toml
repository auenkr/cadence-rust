[package]
name = "cadence-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "cadence-server"
path = "src/main.rs"

[dependencies]
cadence-api = { path = "../cadence-api" }
cadence-common = { path = "../cadence-common" }
cadence-persistence = { path = "../cadence-persistence" }
cadence-thrift = { path = "../cadence-thrift" }
cadence-proto = { path = "../cadence-proto" }
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
tonic-reflection = "0.12"
crc32fast = "1"
crc32c = "0.6"
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

[dev-dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
base64 = "0.22"
tempfile = "3"
axum = { version = "0.8", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
