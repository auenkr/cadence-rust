[package]
name = "cadence-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "cadence-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
cadence-service-core = { path = "../cadence-service-core" }
cadence-proto = { path = "../cadence-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tonic = { version = "0.12", features = ["tls"] }
tokio = { version = "1", features = ["full"] }
