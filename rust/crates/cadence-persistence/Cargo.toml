[package]
name = "cadence-persistence"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
scylla = { version = "=1.9.0", features = ["chrono-04"] }
cadence-thrift = { path = "../cadence-thrift" }
cadence-api = { path = "../cadence-api" }
cadence-common = { path = "../cadence-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5"] }
sqlparser = "0.53"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rand = "0.8"
rusqlite = { version = "0.32.1", features = ["bundled", "hooks"] }
mysql = { version = "26.0.1", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring"] }
postgres = { version = "0.19", default-features = false }
farmhash = "1.1.5"
snap = "1.1.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
