[package]
name = "cadence-matching"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "cadence-matching"
path = "src/main.rs"

[dependencies]
cadence-service-core = { path = "../cadence-service-core" }
async-trait = "0.1"
cadence-api = { path = "../cadence-api" }
cadence-common = { path = "../cadence-common" }
cadence-persistence = { path = "../cadence-persistence" }
rusqlite = { version = "0.32.1", features = ["bundled"] }
cadence-thrift = { path = "../cadence-thrift" }
cadence-proto = { path = "../cadence-proto" }
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.12", features = ["tls"] }
tonic-reflection = "0.12"
hyper-util = { version = "0.1", features = ["tokio"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
crc32fast = "1"
crc32c = "0.6"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
if-addrs = "0.13"
hickory-resolver = { version = "0.24.4", default-features = false, features = ["system-config", "tokio-runtime"] }
libc = "0.2"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
base64 = "0.22"
tempfile = "3"
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
axum = { version = "0.8", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
