[package]
name = "cadence-frontend"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "cadence-frontend"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cadence-api = { path = "../cadence-api" }
cadence-matching = { path = "../cadence-matching" }
cadence-service-core = { path = "../cadence-service-core" }
cadence-proto = { path = "../cadence-proto" }
cadence-persistence = { path = "../cadence-persistence" }
cadence-thrift = { path = "../cadence-thrift" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["tls"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
