[workspace]
resolver = "2"
exclude = ["vendor/scylla-cql-2.0.0", "vendor/scylla-cql-core-1.9.0", "vendor/scylla-1.9.0"]
members = [
    "crates/cadence-api",
    "crates/cadence-common",
    "crates/cadence-persistence",
    "crates/cadence-service-core",
    "crates/cadence-matching",
    "crates/cadence-history",
    "crates/cadence-frontend",
    "crates/cadence-worker",
    "crates/cadence-server",
    "crates/cadence-thrift",
    "crates/cadence-proto",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/auenkr/cadence-rust"

[patch.crates-io]
mysql_async = { path = "vendor/mysql_async-0.37.1" }
scylla = { path = "vendor/scylla-1.9.0" }
scylla-cql = { path = "vendor/scylla-cql-2.0.0" }
scylla-cql-core = { path = "vendor/scylla-cql-core-1.9.0" }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
