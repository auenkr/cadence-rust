name: CQL header foundation
on:
  workflow_dispatch:
  push:
    branches: ["t3/matching-cql-integration"]
    paths: [".github/workflows/cql-header-foundation.yml", "rust/Cargo.toml"]
concurrency:
  group: cql-header-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  headers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /tmp/cql-header-target-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate formatting patch on runner
        run: |
          mkdir -p out
          rustfmt --edition 2024 --config skip_children=true rust/vendor/scylla-cql-2.0.0/src/frame/mod.rs rust/vendor/scylla-cql-2.0.0/src/frame/versioned_header.rs rust/vendor/scylla-1.9.0/src/lib.rs rust/vendor/scylla-1.9.0/src/network/connection.rs rust/vendor/scylla-1.9.0/src/client/session.rs rust/vendor/scylla-1.9.0/src/client/session_builder.rs rust/vendor/scylla-1.9.0/src/cluster/metadata/fetching.rs rust/vendor/scylla-cql-core-1.9.0/src/protocol_collections.rs
          rustfmt --edition 2021 rust/crates/cadence-persistence/examples/matching_cassandra_protocol_probe.rs
          git diff --binary > out/format.patch
      - name: Test actual vendored header codec
        run: |
          mkdir -p out
          git rev-parse HEAD > out/commit.txt
          printf '%s\n' "$CARGO_TARGET_DIR" > out/target-dir.txt
          set +e
          (cd rust && cargo test -p scylla-cql --lib versioned_header) > out/test.log 2>&1
          result=$?
          echo "$result" > out/test.exit
          cat out/test.log
          exit "$result"
      - name: Test actual vendored collection codec
        run: |
          set +e
          (cd rust && cargo test -p scylla-cql-core --lib protocol_collections::) > out/collection-test.log 2>&1
          result=$?
          echo "$result" > out/collection-test.exit
          cat out/collection-test.log
          exit "$result"
      - name: Preserve runner-resolved lockfile
        if: always()
        run: cp rust/Cargo.lock out/Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cql-header-foundation
          path: out/
          retention-days: 3
