name: CQL header foundation
on:
  workflow_dispatch:
  push:
    branches: ["t3/matching-cql-integration"]
    paths: [".github/workflows/cql-header-foundation.yml", "rust/Cargo.toml", "rust/vendor/**", "rust/crates/cadence-persistence/**"]
concurrency:
  group: cql-header-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  headers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /tmp/cql-header-target-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate formatting patch on runner
        run: |
          mkdir -p out
          rustfmt --edition 2024 --config skip_children=true rust/vendor/scylla-cql-2.0.0/src/frame/mod.rs rust/vendor/scylla-cql-2.0.0/src/frame/versioned_header.rs rust/vendor/scylla-1.9.0/src/lib.rs rust/vendor/scylla-1.9.0/src/network/connection.rs rust/vendor/scylla-1.9.0/src/client/session.rs rust/vendor/scylla-1.9.0/src/client/session_builder.rs rust/vendor/scylla-1.9.0/src/cluster/metadata/fetching.rs rust/vendor/scylla-cql-core-1.9.0/src/protocol_collections.rs rust/vendor/scylla-1.9.0/src/routing/mod.rs rust/vendor/scylla-1.9.0/src/routing/partitioner.rs
          rustfmt --edition 2021 rust/crates/cadence-persistence/examples/matching_cassandra_protocol_probe.rs
          git diff --binary > out/format.patch
      - name: Test actual vendored scylla and cql crates
        run: |
          mkdir -p out
          git rev-parse HEAD > out/commit.txt
          printf '%s\n' "$CARGO_TARGET_DIR" > out/target-dir.txt
          overall=0
          run_step() {
            name="$1"; pkg="$2"; filter="$3"
            (cd rust && cargo test --manifest-path vendor/Cargo.toml -p "$pkg" --lib "$filter") > "out/$name.log" 2>&1
            rc=$?
            # a compile failure keeps its exit code; a green run that executed zero tests is a failure too
            if [ "$rc" -eq 0 ] && ! grep -Eq 'running [1-9][0-9]* tests?' "out/$name.log"; then
              echo "no tests executed for $name" >> "out/$name.log"; rc=1
            fi
            echo "$rc" > "out/$name.exit"
            grep -E '^error|test result|running [0-9]+ test|no tests executed' "out/$name.log" || true
            [ "$rc" -eq 0 ] || overall=1
          }
          run_step header scylla-cql versioned_header
          run_step collection scylla-cql-core protocol_collections::
          run_step routing scylla routing::partitioner::tests::
          exit "$overall"
      - name: Compile persistence Cassandra protocol probe
        if: always()
        run: |
          mkdir -p out
          set +e
          (cd rust && cargo build -p cadence-persistence --example matching_cassandra_protocol_probe) > out/probe-build.log 2>&1
          echo $? > out/probe-build.exit
          grep -E '^(error|warning: unused)' out/probe-build.log || true
          exit "$(cat out/probe-build.exit)"
      - name: Preserve runner-resolved lockfile
        if: always()
        run: |
          cp rust/Cargo.lock out/Cargo.lock
          if [ -f rust/vendor/Cargo.lock ]; then cp rust/vendor/Cargo.lock out/vendor-Cargo.lock; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cql-header-foundation
          path: out/
          retention-days: 3
