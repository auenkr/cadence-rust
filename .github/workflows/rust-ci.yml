name: rust-ci

# Cargo build/test/clippy for the Rust port run here (free for public repos) instead of on the dev host.
# Trigger manually for any branch: gh workflow run rust-ci.yml --ref <branch> [-f package=cadence-matching]
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Crate to test (empty = whole workspace)"
        required: false
        default: ""
      clean_target:
        description: "Use a fresh uncached target for final validation"
        type: boolean
        default: false
      format_matching_parity_files:
        description: "Format files touched by Matching parity fixes and upload the patch"
        type: boolean
        default: false
      format_tls_files:
        description: "Apply rustfmt to the four Matching TLS-touched Rust files and upload the patch"
        type: boolean
        default: false
      format_query_files:
        description: "Apply rustfmt to the four query-touched Matching files and upload the patch"
        type: boolean
        default: false
      go_sdk_compile:
        description: "Compile the existing Go SDK mixed Matching diagnostic fixture"
        type: boolean
        default: false
      go_domain_cache_uuid_oracle:
        description: "Run the original-Go Matching domain-cache UUID spelling oracle"
        type: boolean
        default: false
  push:
    branches: ["master", "matching-*"]
    paths: ["rust/**", ".github/workflows/rust-ci.yml", "go/idls"]

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      PKG: ${{ github.event.inputs.package }}
    steps:
      - uses: actions/checkout@v4
      - name: Init IDL submodule
        run: git submodule update --init go/idls
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: false
      - uses: actions/setup-node@v4
        if: inputs.go_sdk_compile == true
        with:
          node-version: 22
      - name: Compile Go SDK mixed Matching fixture
        if: inputs.go_sdk_compile == true
        working-directory: tests/go-sdk
        run: |
          evidence="$RUNNER_TEMP/go-sdk-fixture"
          mkdir -p "$evidence"
          set +e
          gofmt -d main.go mixed_matching.go > "$evidence/gofmt.diff" 2>&1
          fmt_result=$?
          if [ -s "$evidence/gofmt.diff" ] && [ "$fmt_result" = 0 ]; then fmt_result=1; fi
          echo "$fmt_result" > "$evidence/gofmt.exit"
          go test -run '^$' . > "$evidence/compile.log" 2>&1
          compile_result=$?
          echo "$compile_result" > "$evidence/compile.exit"
          cat "$evidence/gofmt.diff" "$evidence/compile.log"
          if [ "$fmt_result" != 0 ] || [ "$compile_result" != 0 ]; then exit 1; fi
      - name: Check adaptive probe syntax
        if: inputs.go_sdk_compile == true
        run: |
          evidence="$RUNNER_TEMP/go-sdk-fixture"
          mkdir -p "$evidence"
          set +e
          node --check tests/matching-probe-scenarios.cjs > "$evidence/node-check.log" 2>&1
          node_result=$?
          node --check tests/matching-adaptive-go-control.cjs >> "$evidence/node-check.log" 2>&1
          control_result=$?
          if [ "$control_result" != 0 ]; then node_result="$control_result"; fi
          echo "$node_result" > "$evidence/node-check.exit"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-cache" python3 -m py_compile tests/run-go-service-baseline.py > "$evidence/python-check.log" 2>&1
          python_result=$?
          echo "$python_result" > "$evidence/python-check.exit"
          cat "$evidence/node-check.log" "$evidence/python-check.log"
          if [ "$node_result" != 0 ] || [ "$python_result" != 0 ]; then exit 1; fi
      - name: Upload Go SDK fixture validation evidence
        if: always() && inputs.go_sdk_compile == true
        uses: actions/upload-artifact@v4
        with:
          name: go-sdk-fixture-validation
          retention-days: 3
          path: ${{ runner.temp }}/go-sdk-fixture
      - name: Run Go raw-byte string oracle
        working-directory: go
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/matching-raw-string-oracle"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          go version > "$evidence/go-version.txt"
          go list -m github.com/gogo/protobuf github.com/uber/cadence-idl go.uber.org/yarpc github.com/google/uuid github.com/gocql/gocql > "$evidence/modules.txt"
          gofmt -w ../tests/matching-raw-string-oracle.go
          git diff --binary -- ../tests/matching-raw-string-oracle.go > "$evidence/go-format.patch"
          set +e
          go run ../tests/matching-raw-string-oracle.go > "$evidence/go-oracle.json" 2> "$evidence/go-oracle.log"
          result=$?
          echo "$result" > "$evidence/go-oracle.exit"
          cat "$evidence/go-oracle.log"
          if [ "$result" != 0 ]; then exit "$result"; fi
          echo "MATCHING_GO_RAW_STRING_ORACLE=$evidence/go-oracle.json" >> "$GITHUB_ENV"
      - name: Upload Go raw-byte string oracle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-raw-string-oracle
          retention-days: 3
          path: ${{ runner.temp }}/matching-raw-string-oracle
      - name: Run original Go malformed DescribeTaskList oracle
        working-directory: go
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/matching-describe-tasklist-go-oracle"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          cat > "$RUNNER_TEMP/describe-tasklist-overlay.json" <<EOF
          {"Replace":{"$GITHUB_WORKSPACE/go/service/matching/handler/describe_tasklist_oracle_test.go":"$GITHUB_WORKSPACE/tests/go-matching-describe-tasklist-oracle_test.go","$GITHUB_WORKSPACE/go/service/matching/handler/optional_payload_oracle_test.go":"$GITHUB_WORKSPACE/tests/go-matching-optional-payload-oracle_test.go"}}
          EOF
          cp "$RUNNER_TEMP/describe-tasklist-overlay.json" "$evidence/overlay.json"
          printf '%s\n' 'go test -overlay $RUNNER_TEMP/describe-tasklist-overlay.json ./service/matching/handler -run ^TestMatchingEngineSuite/(TestMalformedDescribeTaskListOracle|TestOptionalPayloadErrorOracle)$ -count=1 -v' > "$evidence/command.txt"
          set +e
          go test -overlay "$RUNNER_TEMP/describe-tasklist-overlay.json" ./service/matching/handler \
            -run '^TestMatchingEngineSuite/(TestMalformedDescribeTaskListOracle|TestOptionalPayloadErrorOracle)$' -count=1 -v \
            > "$evidence/go-oracle.log" 2>&1
          result=$?
          echo "$result" > "$evidence/go-oracle.exit"
          cat "$evidence/go-oracle.log"
          exit "$result"
      - name: Upload original Go oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-describe-tasklist-go-oracle
          retention-days: 3
          path: ${{ runner.temp }}/matching-describe-tasklist-go-oracle
      - name: Run original-Go domain-cache UUID spelling oracle
        if: inputs.go_domain_cache_uuid_oracle == true
        working-directory: go
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/domain-cache-uuid-oracle"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          cat > "$RUNNER_TEMP/domain-cache-uuid-overlay.json" <<EOF
          {"Replace":{"$GITHUB_WORKSPACE/go/common/cache/domain_cache_uuid_oracle_test.go":"$GITHUB_WORKSPACE/tests/go-domain-cache-uuid-oracle_test.go"}}
          EOF
          cp "$RUNNER_TEMP/domain-cache-uuid-overlay.json" "$evidence/overlay.json"
          printf '%s\n' 'go test -overlay $RUNNER_TEMP/domain-cache-uuid-overlay.json ./common/cache -run ^TestDomainCacheSuite/TestDomainCacheUUIDSpellingOracle$ -count=1 -v' > "$evidence/command.txt"
          set +e
          go test -overlay "$RUNNER_TEMP/domain-cache-uuid-overlay.json" ./common/cache \
            -run '^TestDomainCacheSuite/TestDomainCacheUUIDSpellingOracle$' -count=1 -v \
            > "$evidence/go-oracle.log" 2>&1
          result=$?
          echo "$result" > "$evidence/go-oracle.exit"
          cat "$evidence/go-oracle.log"
          exit "$result"
      - name: Upload original-Go domain-cache UUID oracle evidence
        if: always() && inputs.go_domain_cache_uuid_oracle == true
        uses: actions/upload-artifact@v4
        with:
          name: domain-cache-uuid-oracle
          retention-days: 3
          path: ${{ runner.temp }}/domain-cache-uuid-oracle
      - name: Verify Go mapped IPv4 CIDR oracle
        run: GO111MODULE=off go run tests/matching-unleash/go_ipnet_oracle.go
      - name: Verify reviewed Go History TChannel wire fixture
        run: scripts/verify-history-tchannel-wire-oracle.sh
      - name: Execute production Go Matching owner ordering oracle
        run: python3 tests/run-matching-owner-order-oracle.py
      - name: Verify Matching Thrift decoder schema matches Go
        run: |
          python3 tests/gates/gen-matching-thrift-schema.py "$GITHUB_WORKSPACE"
          git diff --exit-code -- rust/crates/cadence-matching/src/thrift_matching_schema.rs
      - name: Audit Matching definitions and rollup map
        run: python3 rust/tools/audit-matching-metrics.py
      - name: Check Go emission oracle formatting
        run: test -z "$(gofmt -d go/tools/matching-metrics-emission-oracle/main.go)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Format Matching parity files
        if: inputs.format_matching_parity_files == true
        working-directory: rust
        run: |
          set -euo pipefail
          files=(
            crates/cadence-common/src/go_string.rs
            crates/cadence-common/src/task_list.rs
            crates/cadence-api/src/tasktoken.rs
            crates/cadence-common/src/lib.rs
            crates/cadence-api/src/lib.rs
            crates/cadence-thrift/src/value.rs
            crates/cadence-persistence/src/matching_task_store.rs
            crates/cadence-persistence/src/matching_native_task_store.rs
            crates/cadence-persistence/src/matching_native_queue.rs
            crates/cadence-persistence/src/matching_cassandra.rs
            crates/cadence-persistence/src/matching_cassandra_exec.rs
            crates/cadence-persistence/src/matching_cassandra_native.rs
            crates/cadence-persistence/src/matching_sqlite_native.rs
            crates/cadence-persistence/src/matching_mysql_native.rs
            crates/cadence-persistence/src/matching_postgres_native.rs
            crates/cadence-persistence/src/dynamic_config.rs
            crates/cadence-proto/build.rs
            crates/cadence-proto/build/native_model.rs
            crates/cadence-proto/build/native_wire.rs
            crates/cadence-proto/build/native_service.rs
            crates/cadence-proto/src/native_service.rs
            crates/cadence-proto/tests/native_matching_transport.rs
            crates/cadence-proto/tests/native_wire_edges.rs
            crates/cadence-matching/src/thrift_matching_native_extra.rs
            crates/cadence-matching/src/thrift_matching_native_responses.rs
            crates/cadence-matching/src/matching_partition_native.rs
            crates/cadence-matching/src/matching_reader_native.rs
            crates/cadence-matching/src/matching_sync_native.rs
            crates/cadence-matching/src/matching_writer_native.rs
            crates/cadence-matching/src/matching_history.rs
            crates/cadence-matching/src/matching_history_native.rs
            crates/cadence-matching/src/matching_history_tchannel_native.rs
            crates/cadence-matching/src/matching_history_peer_resolver.rs
            crates/cadence-matching/src/thrift_matching_native.rs
            crates/cadence-proto/src/lib.rs
            crates/cadence-proto/src/native.rs
            crates/cadence-matching/src/grpc_matching.rs
            crates/cadence-matching/src/thrift_matching.rs
            crates/cadence-matching/src/matching_writer.rs
            crates/cadence-matching/src/matching_reader.rs
            crates/cadence-matching/src/matching_partition.rs
            crates/cadence-matching/src/matching_runtime.rs
            crates/cadence-matching/src/launcher.rs
            crates/cadence-matching/src/matching_cold_domain_metric_tests.rs
            crates/cadence-matching/tests/matching_partial_upgrade_e.rs
            crates/cadence-matching/src/matching_fatal.rs
            crates/cadence-matching/src/main.rs
            crates/cadence-matching/src/matching_standby.rs
            crates/cadence-matching/src/matching_membership_go_tests.rs
            crates/cadence-matching/tests/matching_concurrent_go_parity.rs
            crates/cadence-persistence/src/matching_retry.rs
            crates/cadence-matching/src/matching_registry.rs
            crates/cadence-matching/src/lib.rs
            crates/cadence-matching/src/matching_partition_cancellation_tests.rs
            crates/cadence-matching/src/matching_failover_callback_tests.rs
            crates/cadence-common/src/backoff.rs
          )
          existing=()
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then existing+=("$file"); fi
          done
          rustfmt --edition 2021 --config skip_children=true "${existing[@]}"
          git diff --binary -- "${files[@]}" > "$RUNNER_TEMP/matching-format.patch"
      - name: Upload Matching parity formatting patch
        if: always() && inputs.format_matching_parity_files == true
        uses: actions/upload-artifact@v4
        with:
          name: matching-format-patch
          retention-days: 3
          path: ${{ runner.temp }}/matching-format.patch
      - name: Format TLS-touched Rust files
        if: inputs.format_tls_files == true
        working-directory: rust
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --config skip_children=true \
            crates/cadence-matching/src/grpc_matching.rs \
            crates/cadence-matching/src/launcher.rs \
            crates/cadence-matching/src/matching_rpc_tests.rs \
            crates/cadence-service-core/src/grpc_tls.rs
          git -C "$GITHUB_WORKSPACE" diff --binary -- \
            rust/crates/cadence-matching/src/grpc_matching.rs \
            rust/crates/cadence-matching/src/launcher.rs \
            rust/crates/cadence-matching/src/matching_rpc_tests.rs \
            rust/crates/cadence-service-core/src/grpc_tls.rs \
            > "$RUNNER_TEMP/tls-format.patch"
      - name: Format query-touched Rust files
        if: inputs.format_query_files == true
        working-directory: rust
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --config skip_children=true \
            crates/cadence-matching/src/matching_query.rs \
            crates/cadence-matching/src/matching_registry.rs \
            crates/cadence-matching/src/grpc_matching.rs \
            crates/cadence-matching/src/matching_rpc_tests.rs \
            crates/cadence-matching/src/matching_writer.rs
          git -C "$GITHUB_WORKSPACE" diff --binary -- \
            rust/crates/cadence-matching/src/matching_query.rs \
            rust/crates/cadence-matching/src/matching_registry.rs \
            rust/crates/cadence-matching/src/grpc_matching.rs \
            rust/crates/cadence-matching/src/matching_rpc_tests.rs \
            rust/crates/cadence-matching/src/matching_writer.rs \
            > "$RUNNER_TEMP/query-format.patch"
      - name: Upload query formatting patch
        if: inputs.format_query_files == true
        uses: actions/upload-artifact@v4
        with:
          name: query-format-patch
          retention-days: 3
          path: ${{ runner.temp }}/query-format.patch
      - name: Upload TLS formatting patch
        if: inputs.format_tls_files == true
        uses: actions/upload-artifact@v4
        with:
          name: tls-format-patch
          retention-days: 3
          path: ${{ runner.temp }}/tls-format.patch
      - name: Select fresh final target
        if: inputs.clean_target == true
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target-final" >> "$GITHUB_ENV"
      - name: Capture Go metered persistence wrapper output
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/matching-metrics-emission"
          mkdir -p "$evidence"
          (cd go && go run ./tools/matching-metrics-emission-oracle persistence) > "$evidence/go-persistence-wrapper.json"
          echo "MATCHING_GO_PERSISTENCE_ORACLE=$evidence/go-persistence-wrapper.json" >> "$GITHUB_ENV"
          echo "MATCHING_RUST_PERSISTENCE_ORACLE=$evidence/rust-persistence-wrapper.json" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        if: inputs.clean_target != true
        with:
          workspaces: rust
      - name: Format check
        working-directory: rust
        run: |
          set +e
          cargo fmt --all -- --check > format.log 2>&1
          echo "$?" > workspace-format.exit
          exit 0
        continue-on-error: true
      - name: Check TLS-touched Rust files formatting
        working-directory: rust
        run: |
          set +e
          rustfmt --edition 2021 --config skip_children=true --check \
            crates/cadence-matching/src/grpc_matching.rs \
            crates/cadence-matching/src/launcher.rs \
            crates/cadence-matching/src/matching_rpc_tests.rs \
            crates/cadence-matching/src/matching_writer.rs \
            crates/cadence-service-core/src/grpc_tls.rs \
            > tls-format.log 2>&1
          result=$?
          echo "$result" > tls-format.exit
          cat tls-format.log
          exit 0
      - name: Check query-touched Rust files formatting
        working-directory: rust
        run: |
          set +e
          rustfmt --edition 2021 --config skip_children=true --check \
            crates/cadence-matching/src/matching_query.rs \
            crates/cadence-matching/src/matching_registry.rs \
            crates/cadence-matching/src/grpc_matching.rs \
            crates/cadence-matching/src/matching_rpc_tests.rs \
            crates/cadence-matching/src/matching_writer.rs \
            > query-format.log 2>&1
          result=$?
          echo "$result" > query-format.exit
          cat query-format.log
          exit 0
      - name: Check changed Matching runtime formatting
        working-directory: rust
        run: |
          set +e
          rustfmt --edition 2021 --check crates/cadence-matching/src/launcher.rs crates/cadence-matching/src/matching_config.rs crates/cadence-matching/src/matching_runtime.rs crates/cadence-matching/src/matching_registry.rs crates/cadence-matching/src/matching_writer.rs crates/cadence-persistence/src/dynamic_config.rs crates/cadence-service-core/src/admin.rs crates/cadence-service-core/src/openfeature/runtime.rs > matching-runtime-format.log 2>&1
          result=$?
          echo "$result" > matching-runtime-format.exit
          cat matching-runtime-format.log
          exit "$result"
      - name: Clippy
        working-directory: rust
        run: |
          set +e
          set -o pipefail
          if [ -n "$PKG" ]; then SEL="-p $PKG"; else SEL="--workspace"; fi
          cargo clippy $SEL --all-targets -- -D warnings 2>&1 | tee clippy.log
          result=${PIPESTATUS[0]}
          echo "$result" > clippy.exit
          exit "$result"
      - name: Formatting
        working-directory: rust
        run: |
          set +e
          rustfmt --edition 2021 --check crates/cadence-service-core/src/openfeature/unleash_engine.rs crates/cadence-service-core/src/openfeature/unleash.rs > fmt.log 2>&1
          result=$?
          echo "$result" > fmt.exit
          cat fmt.log
          exit "$result"
      - name: Test
        working-directory: rust
        run: |
          set +e
          set -o pipefail
          if [ -n "$PKG" ]; then SEL="-p $PKG"; else SEL="--workspace"; fi
          if [ "$PKG" = "cadence-matching" ] || [ -z "$PKG" ]; then
            evidence="$RUNNER_TEMP/matching-panic-quote-oracle"
            mkdir -p "$evidence"
            set +e
            go run "$GITHUB_WORKSPACE/tests/matching-panic-quote-oracle.go" > "$evidence/go-1.25.14-quote.txt" 2> "$evidence/go-1.25.14-quote.log"
            result=$?
            echo "$result" > "$evidence/go-1.25.14-quote.exit"
            cat "$evidence/go-1.25.14-quote.log"
            if [ "$result" -ne 0 ]; then exit "$result"; fi
            export MATCHING_GO_PANIC_ORACLE="$evidence/go-1.25.14-quote.txt"
          fi
          cargo test $SEL 2>&1 | tee test.log
          result=${PIPESTATUS[0]}
          echo "$result" > test.exit
          exit "$result"
      - name: Upload Go panic quote oracle evidence
        if: always() && (inputs.package == 'cadence-matching' || inputs.package == '')
        uses: actions/upload-artifact@v4
        with:
          name: matching-panic-quote-oracle
          retention-days: 3
          path: ${{ runner.temp }}/matching-panic-quote-oracle
      - name: Compare live Go tally and Rust Matching emissions
        if: success() && (inputs.package == '' || inputs.package == 'cadence-server')
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/matching-metrics-emission"
          mkdir -p "$evidence"
          for mode in default both name-on name-off; do
            (cd go && go run ./tools/matching-metrics-emission-oracle "$mode") > "$evidence/go-$mode.json"
            (cd rust && cargo run -p cadence-server --example matching_metrics_emission_oracle -- "$mode") > "$evidence/rust-$mode.json"
            python3 tests/compare-matching-metrics-emission.py "$evidence/go-$mode.json" "$evidence/rust-$mode.json" > "$evidence/compare-$mode.json"
          done
          git rev-parse HEAD > "$evidence/head-sha.txt"
          sha256sum "${CARGO_TARGET_DIR:-rust/target}/debug/examples/matching_metrics_emission_oracle" > "$evidence/rust-binary.sha256"
      - name: Upload Matching metrics comparison evidence
        if: always() && (inputs.package == '' || inputs.package == 'cadence-server')
        uses: actions/upload-artifact@v4
        with:
          name: matching-metrics-emission-evidence
          retention-days: 3
          path: ${{ runner.temp }}/matching-metrics-emission
      - name: Record validation identity
        if: always()
        run: |
          git rev-parse HEAD > rust/commit.txt
          printf '%s\n' "${CARGO_TARGET_DIR:-$PWD/rust/target}" > rust/target-dir.txt
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-ci-logs
          retention-days: 3
          path: |
            rust/clippy.log
            rust/fmt.log
            rust/matching-runtime-format.log
            rust/test.log
            rust/*.exit
            rust/commit.txt
            rust/target-dir.txt
            rust/format.log
            rust/tls-format.log
            rust/tls-format.exit
            rust/query-format.log
            rust/query-format.exit
            rust/Cargo.lock
            ${{ runner.temp }}/cadence-matching-owner-order.json
