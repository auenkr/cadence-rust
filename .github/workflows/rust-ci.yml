name: rust-ci

# Cargo build/test/clippy for the Rust port run here (free for public repos) instead of on the dev host.
# Trigger manually for any branch: gh workflow run rust-ci.yml --ref <branch> [-f package=cadence-matching]
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Crate to test (empty = whole workspace)"
        required: false
        default: ""
      clean_target:
        description: "Use a fresh uncached target for final validation"
        type: boolean
        default: false
  push:
    branches: ["master", "matching-*"]
    paths: ["rust/**", ".github/workflows/rust-ci.yml", "go/idls"]

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      PKG: ${{ github.event.inputs.package }}
    steps:
      - uses: actions/checkout@v4
      - name: Init IDL submodule
        run: git submodule update --init go/idls
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Select fresh final target
        if: inputs.clean_target == true
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target-final" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        if: inputs.clean_target != true
        with:
          workspaces: rust
      - name: Format changed Matching runtime sources
        working-directory: rust
        run: |
          files=(crates/cadence-matching/src/launcher.rs crates/cadence-matching/src/matching_config.rs crates/cadence-matching/src/matching_runtime.rs crates/cadence-persistence/src/dynamic_config.rs crates/cadence-service-core/src/admin.rs crates/cadence-service-core/src/openfeature/runtime.rs)
          rustfmt --edition 2021 "${files[@]}"
          rustfmt --edition 2021 --check "${files[@]}"
          mkdir -p formatted-sources
          for file in "${files[@]}"; do mkdir -p "formatted-sources/$(dirname "$file")"; cp "$file" "formatted-sources/$file"; done
      - name: Clippy
        working-directory: rust
        run: |
          set +e
          set -o pipefail
          if [ -n "$PKG" ]; then SEL="-p $PKG"; else SEL="--workspace"; fi
          cargo clippy $SEL --all-targets -- -D warnings 2>&1 | tee clippy.log
          result=${PIPESTATUS[0]}
          echo "$result" > clippy.exit
          exit "$result"
      - name: Test
        working-directory: rust
        run: |
          set +e
          set -o pipefail
          if [ -n "$PKG" ]; then SEL="-p $PKG"; else SEL="--workspace"; fi
          cargo test $SEL 2>&1 | tee test.log
          result=${PIPESTATUS[0]}
          echo "$result" > test.exit
          exit "$result"
      - name: Record validation identity
        if: always()
        run: |
          git rev-parse HEAD > rust/commit.txt
          printf '%s\n' "${CARGO_TARGET_DIR:-$PWD/rust/target}" > rust/target-dir.txt
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-ci-logs
          retention-days: 3
          path: |
            rust/clippy.log
            rust/fmt.log
            rust/test.log
            rust/*.exit
            rust/commit.txt
            rust/target-dir.txt
            rust/formatted-sources/**
