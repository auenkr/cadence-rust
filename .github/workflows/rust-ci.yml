name: rust-ci

# Cargo build/test/clippy for the Rust port run here (free for public repos) instead of on the dev host.
# Trigger manually for any branch: gh workflow run rust-ci.yml --ref <branch> [-f package=cadence-matching]
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Crate to test (empty = whole workspace)"
        required: false
        default: ""
      clean_target:
        description: "Use a fresh uncached target for final validation"
        type: boolean
        default: false
      format_tls_files:
        description: "Apply rustfmt to the four Matching TLS-touched Rust files and upload the patch"
        type: boolean
        default: false
      format_query_files:
        description: "Apply rustfmt to the four query-touched Matching files and upload the patch"
        type: boolean
        default: false
      format_panic_files:
        description: "Format changed Matching panic/cache files and upload the patch only"
        type: boolean
        default: false
  push:
    branches: ["master", "matching-*"]
    paths: ["rust/**", ".github/workflows/rust-ci.yml", "go/idls"]

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-panic-files:
    if: inputs.format_panic_files == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format panic/cache-touched Rust files
        working-directory: rust
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --config skip_children=true \
            crates/cadence-matching/src/matching_panic.rs \
            crates/cadence-matching/src/go_strconv_isprint.rs \
            crates/cadence-matching/src/matching_domain_cache.rs
          git -C "$GITHUB_WORKSPACE" diff --binary -- \
            rust/crates/cadence-matching/src/matching_panic.rs \
            rust/crates/cadence-matching/src/go_strconv_isprint.rs \
            rust/crates/cadence-matching/src/matching_domain_cache.rs \
            > "$RUNNER_TEMP/panic-format.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: panic-format-patch
          retention-days: 3
          path: ${{ runner.temp }}/panic-format.patch

  clippy-test:
    if: inputs.format_panic_files != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      PKG: ${{ github.event.inputs.package }}
    steps:
      - uses: actions/checkout@v4
      - name: Init IDL submodule
        run: git submodule update --init go/idls
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: false
      - name: Regenerate and compare History TChannel wire oracle
        run: |
          set +e
          evidence="$RUNNER_TEMP/history-tchannel-wire-oracle"
          mkdir -p "$evidence"
          printf '%s\n' 'scripts/verify-history-tchannel-wire-oracle.sh' > "$evidence/command.txt"
          printf '%s\n' 'Run the Go generator twice and compare both outputs byte-for-byte.' > "$evidence/stability-command.txt"
          git rev-parse HEAD > "$evidence/head-sha.txt"
          CADENCE_THRIFT_WIRE_FIXTURE_OUT="$evidence/generated.json" \
            scripts/verify-history-tchannel-wire-oracle.sh > "$evidence/verify.log" 2>&1
          result=$?
          echo "$result" > "$evidence/verify.exit"
          (cd go && CADENCE_THRIFT_WIRE_FIXTURE_OUT="$evidence/repeated.json" \
            go test ./common/types/mapper/thrift -run '^TestGenerateHistoryTChannelWireOracle$' -count=1) \
            > "$evidence/repeated.log" 2>&1
          repeat_result=$?
          if [ "$repeat_result" -eq 0 ]; then
            cmp -s "$evidence/generated.json" "$evidence/repeated.json"
            repeat_result=$?
          fi
          echo "$repeat_result" > "$evidence/stability.exit"
          cat "$evidence/verify.log"
          cat "$evidence/repeated.log"
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          if [ "$repeat_result" -ne 0 ]; then
            echo 'Repeated Go fixture generation differed or failed.' >&2
            exit "$repeat_result"
          fi
          echo 'Repeated Go fixture generation is byte-for-byte stable.'
      - name: Upload History TChannel wire oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-tchannel-wire-oracle
          retention-days: 3
          path: ${{ runner.temp }}/history-tchannel-wire-oracle
      - name: Run original Go malformed DescribeTaskList oracle
        working-directory: go
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/matching-describe-tasklist-go-oracle"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          cat > "$RUNNER_TEMP/describe-tasklist-overlay.json" <<EOF
          {"Replace":{"$GITHUB_WORKSPACE/go/service/matching/handler/describe_tasklist_oracle_test.go":"$GITHUB_WORKSPACE/tests/go-matching-describe-tasklist-oracle_test.go","$GITHUB_WORKSPACE/go/service/matching/handler/optional_payload_oracle_test.go":"$GITHUB_WORKSPACE/tests/go-matching-optional-payload-oracle_test.go"}}
          EOF
          cp "$RUNNER_TEMP/describe-tasklist-overlay.json" "$evidence/overlay.json"
          printf '%s\n' 'go test -overlay $RUNNER_TEMP/describe-tasklist-overlay.json ./service/matching/handler -run ^TestMatchingEngineSuite/(TestMalformedDescribeTaskListOracle|TestOptionalPayloadErrorOracle)$ -count=1 -v' > "$evidence/command.txt"
          set +e
          go test -overlay "$RUNNER_TEMP/describe-tasklist-overlay.json" ./service/matching/handler \
            -run '^TestMatchingEngineSuite/(TestMalformedDescribeTaskListOracle|TestOptionalPayloadErrorOracle)$' -count=1 -v \
            > "$evidence/go-oracle.log" 2>&1
          result=$?
          echo "$result" > "$evidence/go-oracle.exit"
          cat "$evidence/go-oracle.log"
          exit "$result"
      - name: Upload original Go oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-describe-tasklist-go-oracle
          retention-days: 3
          path: ${{ runner.temp }}/matching-describe-tasklist-go-oracle
      - name: Verify Go mapped IPv4 CIDR oracle
        run: GO111MODULE=off go run tests/matching-unleash/go_ipnet_oracle.go
      - name: Execute production Go Matching owner ordering oracle
        run: python3 tests/run-matching-owner-order-oracle.py
      - name: Audit Matching definitions and rollup map
        run: python3 rust/tools/audit-matching-metrics.py
      - name: Check Go emission oracle formatting
        run: test -z "$(gofmt -d go/tools/matching-metrics-emission-oracle/main.go)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check vendored CQL driver formatting
        run: rustfmt --edition 2024 --config skip_children=true --check rust/vendor/scylla-cql-2.0.0/src/frame/mod.rs rust/vendor/scylla-1.9.0/src/lib.rs rust/vendor/scylla-1.9.0/src/network/connection.rs rust/vendor/scylla-1.9.0/src/client/session.rs rust/vendor/scylla-1.9.0/src/client/session_builder.rs
      - name: Format TLS-touched Rust files
        if: inputs.format_tls_files == true
        working-directory: rust
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --config skip_children=true \
            crates/cadence-matching/src/grpc_matching.rs \
            crates/cadence-matching/src/launcher.rs \
            crates/cadence-matching/src/matching_rpc_tests.rs \
            crates/cadence-service-core/src/grpc_tls.rs
          git -C "$GITHUB_WORKSPACE" diff --binary -- \
            rust/crates/cadence-matching/src/grpc_matching.rs \
            rust/crates/cadence-matching/src/launcher.rs \
            rust/crates/cadence-matching/src/matching_rpc_tests.rs \
            rust/crates/cadence-service-core/src/grpc_tls.rs \
            > "$RUNNER_TEMP/tls-format.patch"
      - name: Format query-touched Rust files
        if: inputs.format_query_files == true
        working-directory: rust
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --config skip_children=true \
            crates/cadence-matching/src/matching_query.rs \
            crates/cadence-matching/src/matching_registry.rs \
            crates/cadence-matching/src/grpc_matching.rs \
            crates/cadence-matching/src/matching_rpc_tests.rs \
            crates/cadence-matching/src/matching_writer.rs
          git -C "$GITHUB_WORKSPACE" diff --binary -- \
            rust/crates/cadence-matching/src/matching_query.rs \
            rust/crates/cadence-matching/src/matching_registry.rs \
            rust/crates/cadence-matching/src/grpc_matching.rs \
            rust/crates/cadence-matching/src/matching_rpc_tests.rs \
            rust/crates/cadence-matching/src/matching_writer.rs \
            > "$RUNNER_TEMP/query-format.patch"
      - name: Upload query formatting patch
        if: inputs.format_query_files == true
        uses: actions/upload-artifact@v4
        with:
          name: query-format-patch
          retention-days: 3
          path: ${{ runner.temp }}/query-format.patch
      - name: Upload TLS formatting patch
        if: inputs.format_tls_files == true
        uses: actions/upload-artifact@v4
        with:
          name: tls-format-patch
          retention-days: 3
          path: ${{ runner.temp }}/tls-format.patch
      - name: Select fresh final target
        if: inputs.clean_target == true
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target-final" >> "$GITHUB_ENV"
      - name: Capture Go metered persistence wrapper output
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/matching-metrics-emission"
          mkdir -p "$evidence"
          (cd go && go run ./tools/matching-metrics-emission-oracle persistence) > "$evidence/go-persistence-wrapper.json"
          echo "MATCHING_GO_PERSISTENCE_ORACLE=$evidence/go-persistence-wrapper.json" >> "$GITHUB_ENV"
          echo "MATCHING_RUST_PERSISTENCE_ORACLE=$evidence/rust-persistence-wrapper.json" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        if: inputs.clean_target != true
        with:
          workspaces: rust
      - name: Format check
        working-directory: rust
        run: |
          set +e
          cargo fmt --all -- --check > format.log 2>&1
          echo "$?" > workspace-format.exit
          exit 0
        continue-on-error: true
      - name: Check TLS-touched Rust files formatting
        working-directory: rust
        run: |
          set +e
          rustfmt --edition 2021 --config skip_children=true --check \
            crates/cadence-matching/src/grpc_matching.rs \
            crates/cadence-matching/src/launcher.rs \
            crates/cadence-matching/src/matching_rpc_tests.rs \
            crates/cadence-matching/src/matching_writer.rs \
            crates/cadence-service-core/src/grpc_tls.rs \
            > tls-format.log 2>&1
          result=$?
          echo "$result" > tls-format.exit
          cat tls-format.log
          exit 0
      - name: Check query-touched Rust files formatting
        working-directory: rust
        run: |
          set +e
          rustfmt --edition 2021 --config skip_children=true --check \
            crates/cadence-matching/src/matching_query.rs \
            crates/cadence-matching/src/matching_registry.rs \
            crates/cadence-matching/src/grpc_matching.rs \
            crates/cadence-matching/src/matching_rpc_tests.rs \
            crates/cadence-matching/src/matching_writer.rs \
            > query-format.log 2>&1
          result=$?
          echo "$result" > query-format.exit
          cat query-format.log
          exit 0
      - name: Check changed Matching runtime formatting
        working-directory: rust
        run: |
          set +e
          rustfmt --edition 2021 --check crates/cadence-matching/src/matching_panic.rs crates/cadence-matching/src/go_strconv_isprint.rs crates/cadence-matching/src/matching_domain_cache.rs crates/cadence-matching/src/launcher.rs crates/cadence-matching/src/matching_config.rs crates/cadence-matching/src/matching_runtime.rs crates/cadence-matching/src/matching_registry.rs crates/cadence-matching/src/matching_writer.rs crates/cadence-persistence/src/dynamic_config.rs crates/cadence-service-core/src/admin.rs crates/cadence-service-core/src/openfeature/runtime.rs > matching-runtime-format.log 2>&1
          result=$?
          echo "$result" > matching-runtime-format.exit
          cat matching-runtime-format.log
          exit "$result"
      - name: Clippy
        working-directory: rust
        run: |
          set +e
          set -o pipefail
          if [ -n "$PKG" ]; then SEL="-p $PKG"; else SEL="--workspace"; fi
          cargo clippy $SEL --all-targets -- -D warnings 2>&1 | tee clippy.log
          result=${PIPESTATUS[0]}
          echo "$result" > clippy.exit
          exit "$result"
      - name: Formatting
        working-directory: rust
        run: |
          set +e
          rustfmt --edition 2021 --check crates/cadence-service-core/src/openfeature/unleash_engine.rs crates/cadence-service-core/src/openfeature/unleash.rs ../rust/vendor/scylla-1.9.0/src/cluster/metadata/fetching.rs > fmt.log 2>&1
          result=$?
          echo "$result" > fmt.exit
          cat fmt.log
          exit "$result"
      - name: Test
        working-directory: rust
        run: |
          set +e
          set -o pipefail
          if [ -n "$PKG" ]; then SEL="-p $PKG"; else SEL="--workspace"; fi
          cargo test $SEL 2>&1 | tee test.log
          result=${PIPESTATUS[0]}
          echo "$result" > test.exit
          exit "$result"
      - name: Test vendored scylla-cql frame codecs directly
        run: |
          set +e
          (cd rust && cargo test -p scylla-cql --lib frame::) > rust/cql-frame-test.log 2>&1
          result=$?
          echo "$result" > rust/cql-frame-test.exit
          cat rust/cql-frame-test.log
          exit "$result"
      - name: Test vendored driver protocol configuration and streams directly
        working-directory: rust
        run: |
          set +e
          set -uo pipefail
          result=0
          : > cql-driver-test.log
          for test_name in \
            client::session_builder::tests::default_session_builder \
            client::session_builder::tests::session_builder_selects_protocol_version_in_session_config \
            network::connection::tests::protocol_version_propagates_to_host_connection_and_startup_language_version \
            network::connection::tests::v2_stream_allocator_uses_only_nonnegative_i8_ids; do
            cargo test -p scylla --lib "$test_name" -- --exact > cql-driver-case.log 2>&1
            case_result=$?
            cat cql-driver-case.log >> cql-driver-test.log
            if [ "$case_result" -ne 0 ]; then result="$case_result"; break; fi
            if ! grep -q 'test result: ok. 1 passed;' cql-driver-case.log; then result=1; break; fi
          done
          echo "$result" > cql-driver-test.exit
          cat cql-driver-test.log
          exit "$result"
      - name: Test vendored scylla metadata readers directly
        working-directory: rust
        run: |
          set +e
          cargo test -p scylla --lib cluster::metadata::fetching::tests:: > cql-metadata-test.log 2>&1
          result=$?
          echo "$result" > cql-metadata-test.exit
          cat cql-metadata-test.log
          exit "$result"
      - name: Compare live Go tally and Rust Matching emissions
        if: success() && (inputs.package == '' || inputs.package == 'cadence-server')
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/matching-metrics-emission"
          mkdir -p "$evidence"
          for mode in default both name-on name-off; do
            (cd go && go run ./tools/matching-metrics-emission-oracle "$mode") > "$evidence/go-$mode.json"
            (cd rust && cargo run -p cadence-server --example matching_metrics_emission_oracle -- "$mode") > "$evidence/rust-$mode.json"
            python3 tests/compare-matching-metrics-emission.py "$evidence/go-$mode.json" "$evidence/rust-$mode.json" > "$evidence/compare-$mode.json"
          done
          git rev-parse HEAD > "$evidence/head-sha.txt"
          sha256sum "${CARGO_TARGET_DIR:-rust/target}/debug/examples/matching_metrics_emission_oracle" > "$evidence/rust-binary.sha256"
      - name: Upload Matching metrics comparison evidence
        if: always() && (inputs.package == '' || inputs.package == 'cadence-server')
        uses: actions/upload-artifact@v4
        with:
          name: matching-metrics-emission-evidence
          retention-days: 3
          path: ${{ runner.temp }}/matching-metrics-emission
      - name: Record validation identity
        if: always()
        run: |
          git rev-parse HEAD > rust/commit.txt
          printf '%s\n' "${CARGO_TARGET_DIR:-$PWD/rust/target}" > rust/target-dir.txt
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-ci-logs
          retention-days: 3
          path: |
            rust/clippy.log
            rust/fmt.log
            rust/matching-runtime-format.log
            rust/test.log
            rust/cql-frame-test.log
            rust/cql-driver-test.log
            rust/cql-metadata-test.log
            rust/*.exit
            rust/commit.txt
            rust/target-dir.txt
            rust/format.log
            rust/tls-format.log
            rust/tls-format.exit
            rust/query-format.log
            rust/query-format.exit
            rust/Cargo.lock
            ${{ runner.temp }}/cadence-matching-owner-order.json
