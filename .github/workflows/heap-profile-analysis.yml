name: Heap profile symbolization (existing soak artifacts)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing frontend-soak run with System snapshots and unstripped binary
        required: true
concurrency:
  group: heap-profile-analysis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: soak-binaries
          path: bin
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: soak-rust
          path: data
      - name: Symbolize snapshots in one addr2line process
        timeout-minutes: 10
        run: |
          python3 -m py_compile tests/gates/system-heap-symbolize.py
          sha256sum bin/cadence-server > data/heap-profiles/symbolized-binary.sha256
          python3 tests/gates/system-heap-symbolize.py bin/cadence-server data/heap-profiles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-heap-analysis
          path: data/heap-profiles/
          retention-days: 3
