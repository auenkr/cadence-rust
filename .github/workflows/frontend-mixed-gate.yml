name: Frontend mixed gate (SQL/Cassandra, Rust Frontend + Rust Matching, Go History/Worker)
on:
  workflow_dispatch:
    inputs:
      database:
        description: Persistence lane
        type: choice
        options: [mysql, postgres, cassandra]
        default: mysql
      kafka:
        description: Also run the async workflow (Kafka) acceptance steps
        type: boolean
        default: true
      es:
        description: Also run the advanced visibility (Elasticsearch + Kafka + Go indexer) steps; requires kafka
        type: boolean
        default: false
      es_flavor:
        description: Search backend for es=true
        type: choice
        options: [elasticsearch, opensearch]
        default: elasticsearch
      s3:
        description: Also run the S3 archival (MinIO) steps; mysql only
        type: boolean
        default: false
      gcs:
        description: Also run the GCS archival (fake-gcs-server) steps; mysql only
        type: boolean
        default: false
      two_history:
        description: Run two Go History hosts and kill/restart one during SDK traffic
        type: boolean
        default: false
      two_cluster:
        description: Run the two-cluster redirection gate instead (Rust FE+Matching cluster A vs Go cluster B)
        type: boolean
        default: false
      rust_history:
        description: With two_cluster, run cluster A History as Rust History and assert replication from Go cluster B
        type: boolean
        default: false
      rust_history_side:
        description: With two_cluster+rust_history, run Rust History on the standby (A, default) or active (B, source of replication; A all Go) cluster
        default: standby
      two_history_graceful:
        description: With two_cluster+rust_history (side standby), run two Rust History hosts on cluster A and a graceful failover to A asserting cross-host failover markers
        type: boolean
        default: false
      rust_ref:
        description: branch/ref of the Rust sources to build cadence-server from
        default: ""

concurrency:
  group: frontend-mixed-gate-${{ github.ref }}-${{ inputs.database }}-${{ inputs.es_flavor }}-${{ inputs.es }}-${{ inputs.gcs }}-${{ inputs.two_history_graceful }}-${{ inputs.rust_history }}-${{ inputs.two_cluster }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      CARGO_TARGET_DIR: /tmp/cadence-cargo-target-fe-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rust sources
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rust_ref || github.ref_name }}
          path: rustsrc
          submodules: true
      - name: IDL submodule
        run: git submodule update --init go/idls
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            tests/frontend-gate/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Install admin probe deps
        run: python3 -m pip install --user grpcio grpcio-tools
      - name: Build Rust cadence-server (fresh target dir)
        run: |
          mkdir -p out
          echo "rust_ref=${{ inputs.rust_ref || github.ref_name }} head=$(git -C rustsrc rev-parse HEAD) gate_head=$(git rev-parse HEAD)" | tee out/commit.txt
          set +e
          cargo build --manifest-path rustsrc/rust/Cargo.toml -p cadence-server ${{ inputs.rust_history && '-p cadence-history' || '' }} -j2 > out/cargo-build.log 2>&1; echo $? > out/cargo-build.exit
          set -e
          test "$(cat out/cargo-build.exit)" = 0 || { tail -60 out/cargo-build.log; exit 1; }
          sha256sum "$CARGO_TARGET_DIR/debug/cadence-server" | tee out/binary.sha256
      - name: Build Go server, CLI and SDK driver
        run: |
          (cd go/cmd/server && go build -p 2 -ldflags='-s -w' -o "$GITHUB_WORKSPACE/out/cadence-go-server" .)
          (cd go && go build -p 2 -ldflags='-s -w' -o "$GITHUB_WORKSPACE/out/cadence-cli" ./cmd/tools/cli)
          (cd tests/frontend-gate && go build -o "$GITHUB_WORKSPACE/out/frontend-gate-driver" .)
      - name: Gate (SDK child, completed backfill, API coverage, IPv6 gRPC)
        env:
          CADENCE_GATE_KAFKA: ${{ inputs.kafka }}
          CADENCE_GATE_ES: ${{ inputs.es }}
          CADENCE_GATE_ES_FLAVOR: ${{ inputs.es_flavor || 'elasticsearch' }}
          CADENCE_GATE_S3: ${{ inputs.s3 }}
          CADENCE_GATE_GCS: ${{ inputs.gcs }}
          CADENCE_GATE_TWO_HISTORY: ${{ inputs.two_history }}
        run: |
          set +e
          if [ "${{ inputs.two_cluster }}" = true ]; then
            tests/gates/run-frontend-two-cluster-lane.sh out/gate \
              --rust-binary "$CARGO_TARGET_DIR/debug/cadence-server" \
              --go-server "$GITHUB_WORKSPACE/out/cadence-go-server" \
              --go-cli "$GITHUB_WORKSPACE/out/cadence-cli" \
              ${{ inputs.rust_history && '--rust-history-binary "$CARGO_TARGET_DIR/debug/cadence-history"' || '' }} --rust-history-side ${{ inputs.rust_history_side || 'standby' }} ${{ inputs.two_history_graceful && '--two-history-graceful' || '' }} \
              --rust-root "$GITHUB_WORKSPACE/rustsrc" > out/gate.log 2>&1
          elif [ "${{ inputs.database || 'mysql' }}" = cassandra ]; then
            RUST_BACKTRACE=1 tests/gates/run-frontend-cassandra-lane.sh out/gate \
              --rust-binary "$CARGO_TARGET_DIR/debug/cadence-server" \
              --go-server "$GITHUB_WORKSPACE/out/cadence-go-server" \
              --go-cli "$GITHUB_WORKSPACE/out/cadence-cli" \
              --driver "$GITHUB_WORKSPACE/out/frontend-gate-driver" \
              --rust-root "$GITHUB_WORKSPACE/rustsrc" > out/gate.log 2>&1
          else
            tests/gates/run-frontend-${{ inputs.database || 'mysql' }}-lane.sh out/gate \
              --rust-binary "$CARGO_TARGET_DIR/debug/cadence-server" \
              --go-server "$GITHUB_WORKSPACE/out/cadence-go-server" \
              --go-cli "$GITHUB_WORKSPACE/out/cadence-cli" \
              --driver "$GITHUB_WORKSPACE/out/frontend-gate-driver" \
              --rust-root "$GITHUB_WORKSPACE/rustsrc" > out/gate.log 2>&1
          fi
          echo $? > out/gate.exit
          grep -E '^(GATE|STEP|SDK|---|RESULT|panic)' out/gate.log | cut -c1-400
          mkdir -p out/logs; cp -r out/gate/run/*.log out/gate/run/*.json out/gate/run/*.cmd out/gate/run/*.yaml out/gate/run/*.sha256 out/gate/run/*.prom out/logs/ 2>/dev/null || true
          exit "$(cat out/gate.exit)"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-mixed-gate
          path: |
            out/
            !out/cadence-go-server
            !out/cadence-cli
            !out/frontend-gate-driver
            !out/gate/run/**
          retention-days: 3
