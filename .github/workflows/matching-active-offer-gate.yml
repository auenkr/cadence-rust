name: Matching active offer mixed gate
on:
  workflow_dispatch:

concurrency:
  group: matching-active-offer-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /tmp/cadence-cargo-target-active-offer-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: IDL submodule
        run: git submodule update --init go/idls
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            tests/go-sdk/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build fresh Rust Matching
        run: |
          mkdir -p out
          git rev-parse HEAD > out/commit.txt
          set +e
          cargo build --manifest-path rust/Cargo.toml -p cadence-matching -j2 > out/build.log 2>&1
          result=$?
          echo "$result" > out/build.exit
          if [ "$result" != 0 ]; then tail -60 out/build.log; exit "$result"; fi
          sha256sum "$CARGO_TARGET_DIR/debug/cadence-matching" > out/binary.sha256
      - name: Probe dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/node-grpc"
          cd "$RUNNER_TEMP/node-grpc"
          npm install @grpc/grpc-js@^1.14.6 @grpc/proto-loader@^0.8.1
      - name: Run active offer against Go History
        env:
          NODE_PATH: ${{ runner.temp }}/node-grpc/node_modules
        run: |
          set +e
          printf '%s\n' 'tests/gates/run-mysql-lane.sh out/gate "$CARGO_TARGET_DIR/debug/cadence-matching" --probe-active-offer --matching-idle-check-seconds 3' > out/command.txt
          tests/gates/run-mysql-lane.sh out/gate "$CARGO_TARGET_DIR/debug/cadence-matching" \
            --probe-active-offer --matching-idle-check-seconds 3 > out/gate.log 2>&1
          result=$?
          echo "$result" > out/gate.exit
          tail -60 out/gate.log | cut -c1-300
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matching-active-offer-gate
          path: out/
          retention-days: 3
