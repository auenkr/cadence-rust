name: Matching mixed gate (MySQL, two Rust Matching nodes)
on:
  push:
    branches: ["matching-*"]
    paths: ['.github/workflows/matching-mixed-gate.yml', 'rust/**', 'tests/**']
  workflow_dispatch:
    inputs:
      extra_args:
        description: extra harness args
        default: "--matching-restart --matching-failure-recovery --matching-idle-check-seconds 3"

concurrency:
  group: matching-mysql-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /tmp/cadence-cargo-target-mysql-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: IDL submodule
        run: git submodule update --init go/idls
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            tests/go-sdk/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Rust cadence-matching
        run: |
          mkdir -p out
          set +e
          cargo build --manifest-path rust/Cargo.toml -p cadence-matching -j2 > out/cargo-build.log 2>&1; echo $? > out/cargo-build.exit
          set -e
          cat out/cargo-build.exit
          test "$(cat out/cargo-build.exit)" = 0 || { tail -50 out/cargo-build.log; exit 1; }
          sha256sum "$CARGO_TARGET_DIR/debug/cadence-matching" | tee out/binary.sha256
      - name: Node gRPC deps
        run: |
          mkdir -p "$RUNNER_TEMP/node-grpc" && cd "$RUNNER_TEMP/node-grpc"
          npm install @grpc/grpc-js@^1.14.6 @grpc/proto-loader@^0.8.1
          echo "NODE_PATH=$RUNNER_TEMP/node-grpc/node_modules" >> "$GITHUB_ENV"
      - name: Gate
        env:
          EXTRA_ARGS: ${{ inputs.extra_args }}
          DEFAULT_ARGS: --matching-restart --matching-failure-recovery --matching-idle-check-seconds 3
        run: |
          git rev-parse HEAD > out/commit.txt
          echo "tests/gates/run-mysql-lane.sh out/gate $CARGO_TARGET_DIR/debug/cadence-matching ${EXTRA_ARGS:-$DEFAULT_ARGS}" > out/command.txt
          set +e
          tests/gates/run-mysql-lane.sh out/gate "$CARGO_TARGET_DIR/debug/cadence-matching" ${EXTRA_ARGS:-$DEFAULT_ARGS} > out/gate.log 2>&1
          echo $? > out/gate.exit
          cat out/gate.exit
          tail -60 out/gate.log | cut -c1-300
          exit "$(cat out/gate.exit)"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-mixed-gate
          path: out/
          retention-days: 3
