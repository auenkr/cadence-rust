name: Matching mixed gate (MySQL, two Rust Matching nodes)
on:
  workflow_dispatch:
    inputs:
      fresh:
        description: Disable the cargo cache and build in a fresh target dir (required for final validation evidence)
        type: boolean
        default: false
      extra_args:
        description: extra harness args
        default: "--matching-restart --matching-failure-recovery --matching-idle-check-seconds 3"

concurrency:
  # Dispatches are independent samples: include run_id so parallel workers never cancel each other.
  group: matching-mysql-gate-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cadence-target
    steps:
      - uses: actions/checkout@v4
      - name: IDL submodule
        run: git submodule update --init --recursive go && scripts/go-overlay.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            tests/go-sdk/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache (disabled with fresh=true)
        if: ${{ !inputs.fresh }}
        uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: "rust -> ../cadence-target"
          shared-key: gate-debug-matching
          # Only master (and this branch while it is tested) saves, to stay inside the 10GB repo quota.
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ci-speedup' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Rust cadence-matching
        run: |
          mkdir -p out
          set +e
          cargo build --manifest-path rust/Cargo.toml -p cadence-matching -j2 > out/cargo-build.log 2>&1; echo $? > out/cargo-build.exit
          set -e
          cat out/cargo-build.exit
          test "$(cat out/cargo-build.exit)" = 0 || { tail -50 out/cargo-build.log; exit 1; }
          sha256sum "$CARGO_TARGET_DIR/debug/cadence-matching" | tee out/binary.sha256
      - name: Node gRPC deps
        run: |
          mkdir -p "$RUNNER_TEMP/node-grpc" && cd "$RUNNER_TEMP/node-grpc"
          npm install @grpc/grpc-js@^1.14.6 @grpc/proto-loader@^0.8.1
          echo "NODE_PATH=$RUNNER_TEMP/node-grpc/node_modules" >> "$GITHUB_ENV"
      - name: Gate
        env:
          EXTRA_ARGS: ${{ inputs.extra_args }}
          DEFAULT_ARGS: --matching-restart --matching-failure-recovery --matching-idle-check-seconds 3
        run: |
          git rev-parse HEAD > out/commit.txt
          echo "tests/gates/run-mysql-lane.sh out/gate $CARGO_TARGET_DIR/debug/cadence-matching ${EXTRA_ARGS:-$DEFAULT_ARGS}" > out/command.txt
          set +e
          tests/gates/run-mysql-lane.sh out/gate "$CARGO_TARGET_DIR/debug/cadence-matching" ${EXTRA_ARGS:-$DEFAULT_ARGS} > out/gate.log 2>&1
          result=$?
          if [ "$result" -eq 0 ]; then grep -Fx "GATE SUMMARY failed: []" out/gate.log || result=1; fi
          echo $result > out/gate.exit
          cat out/gate.exit
          tail -60 out/gate.log | cut -c1-300
          exit "$(cat out/gate.exit)"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-mixed-gate
          # Preserve runtime evidence and binary hashes without storing generated executables.
          path: |
            out/
            !out/**/cadence-server
            !out/**/shard-distributor-real
            !out/**/configstore-seed
          retention-days: 3
