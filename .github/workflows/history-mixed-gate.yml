name: History mixed gate (Rust History, Frontend and Matching; Go Worker)

on:
  workflow_dispatch:
    inputs:
      database:
        description: Persistence lane
        type: choice
        options: [mysql, postgres, cassandra]
        default: mysql
      two_history:
        description: Kill and restart a Rust History host during SDK traffic
        type: boolean
        default: true
      all_rust_recovery:
        description: Crash and recover each Rust service with in-flight SDK workflows (Go Worker only)
        type: boolean
        default: false
      s3_archival:
        description: Run only the Rust History S3 archival end-to-end phase (MinIO container, mysql lane)
        type: boolean
        default: false
      gcs:
        description: With s3_archival, also run the Rust History GCS archival phase (fake-gcs-server; mysql lane only)
        type: boolean
        default: false
      queue_v2:
        description: Explicitly enable history.enableTimerQueueV2 and history.enableTransferQueueV2 for Rust History
        type: boolean
        default: false
      outbound:
        description: Rust service outbound transport
        type: choice
        options: [grpc, tchannel]
        default: grpc

concurrency:
  group: history-mixed-${{ github.ref }}-${{ inputs.database }}-${{ inputs.outbound }}-${{ inputs.two_history }}-${{ inputs.s3_archival }}-${{ inputs.gcs }}-${{ inputs.queue_v2 }}-${{ inputs.all_rust_recovery }}-${{ github.sha }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      CARGO_TARGET_DIR: /tmp/cadence-history-gate-${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            tests/frontend-gate/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Install probe dependencies
        run: python3 -m pip install --user grpcio grpcio-tools
      - name: Validate harness syntax and record source identity
        run: |
          mkdir -p out
          git rev-parse HEAD > out/head-sha.txt
          python3 -m py_compile tests/gates/run-frontend-gate.py
          bash -n tests/gates/run-frontend-${{ inputs.database }}-lane.sh
      - name: Build Rust services in fresh target directory
        run: |
          set +e
          cargo build --manifest-path rust/Cargo.toml -p cadence-server -p cadence-history > out/cargo-build.log 2>&1
          result=$?
          echo "$result" > out/cargo-build.exit
          tail -60 out/cargo-build.log
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          sha256sum "$CARGO_TARGET_DIR/debug/cadence-server" "$CARGO_TARGET_DIR/debug/cadence-history" > out/rust-binaries.sha256
      - name: Build Go Worker, CLI and existing SDK driver
        run: |
          (cd go && go build -p 2 -ldflags='-s -w' -o "$GITHUB_WORKSPACE/out/cadence-go-server" ./cmd/server)
          (cd go && go build -p 2 -ldflags='-s -w' -o "$GITHUB_WORKSPACE/out/cadence-cli" ./cmd/tools/cli)
          (cd tests/frontend-gate && go build -p 2 -o "$GITHUB_WORKSPACE/out/frontend-gate-driver" .)
      - name: SDK workflows and History crash recovery
        env:
          CADENCE_GATE_TWO_HISTORY: ${{ inputs.s3_archival && 'false' || inputs.two_history }}
          CADENCE_GATE_S3: ${{ inputs.s3_archival }}
          CADENCE_GATE_GCS: ${{ inputs.gcs }}
          CADENCE_GATE_QUEUE_V2: ${{ inputs.queue_v2 }}
          CADENCE_S3_DOCKER: ${{ inputs.s3_archival }}
          CADENCE_S3_READER: ${{ inputs.s3_archival }}
          RUST_BACKTRACE: 1
          RUST_LOG: warn,cadence_history::task=debug,cadence_history::queue=debug,cadence_history::wiring=debug,cadence_history::engine=debug
        run: |
          set +e
          tests/gates/run-frontend-${{ inputs.database }}-lane.sh out/gate \
            --rust-binary "$CARGO_TARGET_DIR/debug/cadence-server" \
            --rust-history-binary "$CARGO_TARGET_DIR/debug/cadence-history" \
            --go-server "$GITHUB_WORKSPACE/out/cadence-go-server" \
            --go-cli "$GITHUB_WORKSPACE/out/cadence-cli" \
            --driver "$GITHUB_WORKSPACE/out/frontend-gate-driver" \
            --rust-root "$GITHUB_WORKSPACE" \
            ${{ inputs.s3_archival && '--rust-s3-archival-only' || '' }} \
            ${{ inputs.all_rust_recovery && '--all-rust-recovery' || '' }} \
            --rust-outbound "${{ inputs.outbound }}" > out/gate.log 2>&1
          result=$?
          if [ "$result" -eq 0 ]; then
            grep -Fx "GATE SUMMARY failed: []" out/gate.log || result=1
          fi
          cat out/rust-binaries.sha256
          echo "$result" > out/gate.exit
          tail -100 out/gate.log
          exit "$result"
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: history-mixed-gate-${{ inputs.database }}-${{ inputs.outbound }}-s3${{ inputs.s3_archival }}-gcs${{ inputs.gcs }}-q2${{ inputs.queue_v2 }}
          retention-days: 3
          path: |
            out/
            !out/cadence-go-server
            !out/cadence-cli
            !out/frontend-gate-driver
