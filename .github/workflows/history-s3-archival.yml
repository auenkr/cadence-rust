name: History S3 archival (Rust History to MinIO, read via Rust Frontend and Go s3store)

on:
  workflow_dispatch:
    inputs:
      outbound:
        description: Rust service outbound transport
        type: choice
        options: [grpc, tchannel]
        default: grpc

concurrency:
  group: history-s3-archival-${{ github.ref }}-${{ inputs.outbound }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      CARGO_TARGET_DIR: /tmp/cadence-history-s3-${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            tests/frontend-gate/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Install probe dependencies
        run: python3 -m pip install --user grpcio grpcio-tools
      - name: Validate harness syntax and record source identity
        run: |
          mkdir -p out
          git rev-parse HEAD > out/head-sha.txt
          python3 -m py_compile tests/gates/run-frontend-gate.py
          bash -n tests/gates/run-frontend-mysql-lane.sh tests/gates/lib-s3.sh
      - name: Build Rust services in fresh target directory
        run: |
          set +e
          cargo build --manifest-path rust/Cargo.toml -p cadence-server -p cadence-history > out/cargo-build.log 2>&1
          result=$?
          echo "$result" > out/cargo-build.exit
          tail -60 out/cargo-build.log
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          sha256sum "$CARGO_TARGET_DIR/debug/cadence-server" "$CARGO_TARGET_DIR/debug/cadence-history" > out/rust-binaries.sha256
      - name: Build Go Worker, CLI and SDK driver
        run: |
          (cd go && go build -p 2 -ldflags='-s -w' -o "$GITHUB_WORKSPACE/out/cadence-go-server" ./cmd/server)
          (cd go && go build -p 2 -ldflags='-s -w' -o "$GITHUB_WORKSPACE/out/cadence-cli" ./cmd/tools/cli)
          (cd tests/frontend-gate && go build -p 2 -o "$GITHUB_WORKSPACE/out/frontend-gate-driver" .)
      - name: Rust History S3 archival end to end (MinIO container, 512m / 0.5 cpu)
        env:
          CADENCE_GATE_S3: "true"
          CADENCE_S3_DOCKER: "true"
          CADENCE_S3_READER: "true"
          RUST_BACKTRACE: 1
          RUST_LOG: warn,cadence_history::task=debug,cadence_common::cloud_archiver=debug
        run: |
          set +e
          tests/gates/run-frontend-mysql-lane.sh out/gate \
            --rust-binary "$CARGO_TARGET_DIR/debug/cadence-server" \
            --rust-history-binary "$CARGO_TARGET_DIR/debug/cadence-history" \
            --go-server "$GITHUB_WORKSPACE/out/cadence-go-server" \
            --go-cli "$GITHUB_WORKSPACE/out/cadence-cli" \
            --driver "$GITHUB_WORKSPACE/out/frontend-gate-driver" \
            --rust-root "$GITHUB_WORKSPACE" \
            --rust-s3-archival-only \
            --rust-outbound "${{ inputs.outbound }}" > out/gate.log 2>&1
          result=$?
          echo "$result" > out/gate.exit
          tail -100 out/gate.log
          exit "$result"
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: history-s3-archival-${{ inputs.outbound }}
          retention-days: 3
          path: |
            out/
            !out/cadence-go-server
            !out/cadence-cli
            !out/frontend-gate-driver
            !out/gate/s3-reader
