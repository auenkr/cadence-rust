name: Frontend + Matching paired benchmark
run-name: Benchmark ${{ inputs.service || 'matching' }} source ${{ inputs.source_ref || github.sha }}
on:
  workflow_dispatch:
    inputs:
      fresh_build:
        description: Ignore the cached Rust binaries for this tree and build with --no-cache (final evidence)
        type: boolean
        default: false
      sdk_openloop:
        description: Run the isolated service fixed-arrival harness in Benchmark/
        type: boolean
        default: false
      service:
        description: Isolated service to replace in SDK benchmark
        type: choice
        options: [matching, frontend, history, all]
        default: matching
      sdk_suite:
        description: Run fixed-load, stepped capacity and database recovery smoke suite
        type: boolean
        default: false
      source_ref:
        description: Exact migrated source commit (empty uses workflow head)
        default: ''
      capacity_rates:
        description: Comma separated capacity starts/s (suite mode); capacity_only skips fixed/recovery
        default: '25,100'
      capacity_only:
        type: boolean
        default: false
      worker_pollers:
        description: SDK worker decision/activity pollers (0 = SDK default)
        default: '0'
      mysql_args:
        description: Extra mysqld args, both arms (default removes runner-disk fsync ceiling; 'none' = MySQL defaults)
        default: '--innodb-flush-log-at-trx-commit=2 --sync-binlog=0'
      history_shards:
        description: numHistoryShards (both arms)
        default: '4'
      dynamic_config_extra:
        description: YAML appended to dynamic config (literal \n for newlines; both arms)
        default: ''
      rust_services:
        description: Services run from the Rust image in the paired rust arm (all-Rust cluster = frontend,matching,history)
        default: 'frontend,matching'
      sdk_repetitions:
        description: Fresh database pairs for SDK mode
        default: '1'
      requests:
        description: Measured workflows per concurrency and arm
        type: number
        default: 1000
      warmup:
        description: Warmup workflows per concurrency and arm
        type: number
        default: 10
      repetitions:
        description: Alternating Go/Rust fresh database repetitions
        type: number
        default: 5
      concurrency:
        description: Comma separated closed-loop concurrency levels
        type: string
        default: "1,16,64"
      payload_bytes:
        description: Activity payload size in bytes
        type: number
        default: 1024
      profile:
        description: 'perf record Rust History (PROFILE_SERVICES) during measurement (1 = on, builds rust image with frame pointers)'
        default: '0'
      heap_profile:
        description: 'Build Rust History with jemalloc heap profiling and attach jeprof --text of the peak dump (1 = on)'
        default: '0'
      control_ref:
        description: Enables three-arm mode (Go, Rust control built from this ref, Rust candidate = dispatched ref), same job/runner, interleaved. Empty = two-arm. Use 'origin/master' for A/B.
        default: ''
      sql_slow_ms:
        description: Diagnostic - set CADENCE_HISTORY_SQL_SLOW_MS on history (both arms; empty = off) and count slow-transaction log lines
        default: ''
concurrency:
  # Dispatches are independent samples: include run_id so parallel workers never cancel each other.
  group: frontend-matching-benchmark-${{ github.ref }}-${{ inputs.sdk_openloop && inputs.service || 'legacy' }}-${{ github.run_id }}
  cancel-in-progress: true
jobs:
  sdk-service-smoke:
    if: ${{ inputs.sdk_openloop == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: scripts/go-overlay.sh
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: benchmark-source
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: Benchmark/go.mod
          cache-dependency-path: |
            Benchmark/go.sum
            go/go.sum
      - name: Rust binary cache key (rust/ + IDL tree hashes, package, profile)
        id: binkey
        run: |
          src=benchmark-source
          key="bench-bin-v1-${{ inputs.service || 'matching' }}-p${{ inputs.profile || '0' }}-h${{ inputs.heap_profile || '0' }}-$(git -C $src rev-parse HEAD:rust)-$(git -C $src rev-parse HEAD:go)-$(git -C $src rev-parse HEAD:go-overlay)-$(sha256sum Benchmark/Dockerfile | cut -c1-16)"
          echo "key=$key" >> "$GITHUB_OUTPUT"; echo "$key"
      - uses: actions/cache/restore@v4
        id: bincache
        if: ${{ !inputs.fresh_build }}
        with:
          path: ${{ github.workspace }}/.rust-bin
          key: ${{ steps.binkey.outputs.key }}
      - run: bash Benchmark/ci.sh
        env:
          SUITE: ${{ inputs.sdk_suite }}
          CAPACITY_RATES: ${{ inputs.capacity_rates }}
          CAPACITY_ONLY: ${{ inputs.capacity_only }}
          WORKER_POLLERS: ${{ inputs.worker_pollers }}
          MYSQL_ARGS: ${{ inputs.mysql_args }}
          NUM_HISTORY_SHARDS: ${{ inputs.history_shards || '4' }}
          DYNAMIC_CONFIG_EXTRA: ${{ inputs.dynamic_config_extra }}
          CAPACITY_REPETITIONS: ${{ inputs.sdk_repetitions }}
          SERVICE: ${{ inputs.service || 'matching' }}
          REPETITIONS: ${{ inputs.sdk_repetitions || '1' }}
          BENCHMARK_SOURCE_DIR: ${{ github.workspace }}/benchmark-source
          RUST_BIN_CACHE: ${{ github.workspace }}/.rust-bin
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.bincache.outputs.cache-hit != 'true' && hashFiles('.rust-bin/cadence-server') != '' }}
        with:
          path: ${{ github.workspace }}/.rust-bin
          key: ${{ steps.binkey.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.sdk_suite }}
        with:
          name: sdk-${{ inputs.service || 'matching' }}-benchmark
          path: Benchmark/evidence/run/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.sdk_suite }}
        with:
          name: sdk-${{ inputs.service || 'matching' }}-benchmark
          path: |
            Benchmark/evidence/run/suite-summary.json
            Benchmark/evidence/run/ci.exit
            Benchmark/evidence/run/head.txt
            Benchmark/evidence/run/drivers.sha256
            Benchmark/evidence/run/*-build.log
          retention-days: 3
  build-control:
    if: ${{ inputs.sdk_openloop != true && inputs.control_ref != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      same: ${{ steps.cmp.outputs.same }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Check out control ref and compare Rust inputs
        id: cmp
        env:
          CONTROL_REF: ${{ inputs.control_ref }}
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' >/dev/null 2>&1 || true
          git worktree add /tmp/control "$CONTROL_REF"
          git -C /tmp/control submodule update --init --recursive
          (cd /tmp/control && scripts/go-overlay.sh)
          same=1; for d in rust go go-overlay; do [ "$(git rev-parse HEAD:$d)" = "$(git -C /tmp/control rev-parse HEAD:$d)" ] || same=0; done
          echo "same=$same" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/ctrlbin; git -C /tmp/control rev-parse HEAD > /tmp/ctrlbin/control-head.txt
      - uses: docker/setup-buildx-action@v3.10.0
        if: ${{ steps.cmp.outputs.same != '1' }}
      - uses: crazy-max/ghaction-github-runtime@v3.0.0
        if: ${{ steps.cmp.outputs.same != '1' }}
      - name: Build control Rust binaries (same recipe as candidate)
        if: ${{ steps.cmp.outputs.same != '1' }}
        run: |
          docker buildx build -f /tmp/control/rust/Dockerfile --target binaries --build-arg PROFILE=0 --output type=local,dest=/tmp/ctrlbin/bin \
            --cache-from type=gha,scope=rust-image-fat-ctrl --cache-to type=gha,mode=max,scope=rust-image-fat-ctrl /tmp/control 2>&1 | tail -80
          test "${PIPESTATUS[0]}" = 0
          tar -C /tmp/ctrlbin -czf /tmp/ctrlbin/bin.tgz -C /tmp/ctrlbin/bin .
          rm -rf /tmp/ctrlbin/bin
      - uses: actions/upload-artifact@v4
        if: ${{ steps.cmp.outputs.same != '1' }}
        with:
          name: rust-control-binaries
          path: |
            /tmp/ctrlbin/bin.tgz
            /tmp/ctrlbin/control-head.txt
          retention-days: 1
  paired-benchmark:
    if: ${{ always() && inputs.sdk_openloop != true && (needs.build-control.result == 'success' || needs.build-control.result == 'skipped') }}
    needs: [build-control]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: scripts/go-overlay.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/frontend-gate/go.mod
          cache-dependency-path: |
            go/go.sum
            tests/frontend-gate/go.sum
      - name: Validate benchmark tools
        run: |
          mkdir -p out
          python3 -m unittest discover -s tests/benchmark -p 'test_*.py' > out/python-tests.log 2>&1
          python3 -m py_compile tests/frontend-gate/benchmark/paired-run.py
      - name: Build Go server image
        run: |
          mkdir -p out
          mkdir /tmp/gobuild
          rsync -a --exclude .git go/ /tmp/gobuild/
          git -C /tmp/gobuild init -q
          git -C /tmp/gobuild add -A >/dev/null
          git -C /tmp/gobuild -c user.email=ci@example.com -c user.name=ci commit -qm ci
          docker build -f /tmp/gobuild/Dockerfile --target cadence-auto-setup -t cadence-go:ci /tmp/gobuild > out/go-image-build.log 2>&1 || { tail -60 out/go-image-build.log; exit 1; }
          docker image inspect cadence-go:ci --format '{{.Id}} {{.Size}}' > out/go-image.txt
          docker run --entrypoint sha256sum cadence-go:ci /usr/local/bin/cadence-server > out/go-binary.sha256
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: crazy-max/ghaction-github-runtime@v3.0.0
      - name: Build optimized Rust server image
        run: |
          # Benchmarks keep fat LTO / codegen-units=1. The dependency layer (cargo-chef) and the build are
          # restored from the GHA layer cache when Cargo.toml/Cargo.lock/sources are unchanged.
          rm -rf /tmp/rustbin
          { echo "RUST IMAGE PROFILE: lto=fat codegen_units=1 (benchmark)"; echo "CPU: $(grep -m1 'model name' /proc/cpuinfo)"; } | tee out/rust-image-profile.txt
          docker buildx build -f rust/Dockerfile --target binaries --build-arg PROFILE="${{ inputs.profile || '0' }}" --build-arg HEAP_PROFILE="${{ inputs.heap_profile || '0' }}" --output type=local,dest=/tmp/rustbin \
            --cache-from type=gha,scope=rust-image-fat-p${{ inputs.profile || '0' }} --cache-to type=gha,mode=max,scope=rust-image-fat-p${{ inputs.profile || '0' }} . > out/rust-image-build.log 2>&1 || { tail -80 out/rust-image-build.log; exit 1; }
          docker buildx build --builder default --load --pull=false -f rust/Dockerfile --build-context builder=/tmp/rustbin --build-arg GO_IMAGE=cadence-go:ci -t cadence-rust:ci . >> out/rust-image-build.log 2>&1 || { tail -80 out/rust-image-build.log; exit 1; }
          docker image inspect cadence-rust:ci --format '{{.Id}} {{.Size}}' > out/rust-image.txt
          docker run --entrypoint cat cadence-rust:ci /etc/cadence/cadence-server.sha256 > out/rust-binary.sha256
          docker run --entrypoint sha256sum cadence-rust:ci /usr/local/bin/cadence-history >> out/rust-binary.sha256
          docker run --entrypoint sha256sum cadence-rust:ci /usr/local/bin/cadence-server-real >> out/rust-binary.sha256
      - name: Download control Rust binaries
        if: ${{ inputs.control_ref != '' && needs.build-control.outputs.same != '1' }}
        uses: actions/download-artifact@v4
        with:
          name: rust-control-binaries
          path: /tmp/ctrlbin
      - name: Rust control image (three-arm mode, built in build-control job)
        if: ${{ inputs.control_ref != '' }}
        run: |
          lscpu | sed -n 's/^Model name:[[:space:]]*//p' > out/cpu-model.txt
          if [ "${{ needs.build-control.outputs.same }}" = 1 ]; then
            # Identical Rust inputs (rust, go, go-overlay trees) => identical binaries: retag (A/A case).
            echo 1 > out/control-same-tree.txt
            docker tag cadence-rust:ci cadence-rust-control:ci
          else
            echo 0 > out/control-same-tree.txt
            cp /tmp/ctrlbin/control-head.txt out/control-head.txt
            mkdir -p /tmp/ctrlbin/bin && tar -C /tmp/ctrlbin/bin -xzf /tmp/ctrlbin/bin.tgz
            docker buildx build --builder default --load --pull=false -f rust/Dockerfile --build-context builder=/tmp/ctrlbin/bin --build-arg GO_IMAGE=cadence-go:ci -t cadence-rust-control:ci . > out/control-image-build.log 2>&1 || { tail -80 out/control-image-build.log; exit 1; }
          fi
          docker run --entrypoint cat cadence-rust-control:ci /etc/cadence/cadence-server.sha256 > out/control-binary.sha256
          docker run --entrypoint sha256sum cadence-rust-control:ci /usr/local/bin/cadence-history >> out/control-binary.sha256
          docker run --entrypoint sha256sum cadence-rust-control:ci /usr/local/bin/cadence-server-real >> out/control-binary.sha256
      - name: Build CLI and SDK benchmark driver
        working-directory: tests/frontend-gate
        run: |
          gofmt -w benchmark/main.go
          git diff -- benchmark/main.go > ../../out/benchmark-format.diff
          go vet ./benchmark
          go build -trimpath -o ../../out/cadence-benchmark ./benchmark
          (cd ../../go && go build -p 2 -ldflags='-s -w' -o "$GITHUB_WORKSPACE/out/cadence-cli" ./cmd/tools/cli)
          sha256sum ../../out/cadence-benchmark ../../out/cadence-cli > ../../out/drivers.sha256
          git rev-parse HEAD > ../../out/source-head.txt
          go version > ../../out/go-version.txt
          docker version > ../../out/docker-version.txt
      - name: Install perf and FlameGraph
        if: ${{ inputs.profile == '1' }}
        run: |
          sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)" > out/perf-install.log 2>&1 || sudo apt-get install -y -q linux-tools-generic >> out/perf-install.log 2>&1
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          git clone -q --depth 1 https://github.com/brendangregg/FlameGraph /tmp/FlameGraph
      - name: Run paired Go and Rust workload
        env:
          PROFILE: ${{ inputs.profile }}
          BENCH_HEAP_PROFILE: ${{ inputs.heap_profile }}
          FLAMEGRAPH_DIR: /tmp/FlameGraph
          REQUESTS: ${{ inputs.requests || 1000 }}
          WARMUP: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.warmup) || '10' }}
          REPETITIONS: ${{ inputs.repetitions || 5 }}
          CONCURRENCY: ${{ inputs.concurrency || '1,16,64' }}
          PAYLOAD_BYTES: ${{ inputs.payload_bytes || 1024 }}
          BENCH_SQL_SLOW_MS: ${{ inputs.sql_slow_ms }}
        run: |
          set +e
          python3 -u tests/frontend-gate/benchmark/paired-run.py \
            --requests "$REQUESTS" --warmup "$WARMUP" \
            --repetitions "$REPETITIONS" --concurrency "$CONCURRENCY" \
            --payload-bytes "$PAYLOAD_BYTES" ${{ inputs.control_ref != '' && '--control-image cadence-rust-control:ci' || '' }} --rust-services "${{ inputs.rust_services || 'frontend,matching' }}" 2>&1 | tee out/paired-runner.log
          status=${PIPESTATUS[0]}
          echo "$status" > out/paired-runner.exit
          exit "$status"
      - name: jeprof heap profile text
        if: ${{ always() && inputs.heap_profile == '1' }}
        run: |
          sudo apt-get install -y -q libjemalloc-dev > /dev/null 2>&1 || true
          for d in out/paired-benchmark/heap-*; do
            [ -d "$d" ] || continue
            best=$(ls "$d"/*.heap 2>/dev/null | sort -t- -k3 -n | tail -1)
            [ -n "$best" ] || continue
            jeprof --text --inuse_space "$d/cadence-history" "$best" 2>&1 | head -80 > "$d/jeprof-top.txt" || true
            jeprof --text --inuse_space --lines "$d/cadence-history" "$best" 2>&1 | head -80 > "$d/jeprof-top-lines.txt" || true
          done
      - name: Verify complete paired benchmark evidence
        if: ${{ inputs.control_ref == '' }}
        run: |
          set +e
          python3 tests/benchmark/verify_artifacts.py --out out --expected-head "$GITHUB_SHA" > out/artifact-verification.json
          status=$?
          echo "$status" > out/artifact-verification.exit
          cat out/artifact-verification.json
          exit "$status"
      - name: Capture CI runner details
        if: always()
        run: |
          uname -a > out/runner-uname.txt
          lscpu > out/runner-cpu.txt
          free -h > out/runner-memory.txt
          {
            echo "## Machine spec"
            echo "- CPU model: $(lscpu | sed -n 's/^Model name:[[:space:]]*//p')"
            echo "- Cores/threads: $(lscpu | sed -n 's/^Core(s) per socket:[[:space:]]*//p') cores x $(lscpu | sed -n 's/^Thread(s) per core:[[:space:]]*//p') threads/core; sockets $(lscpu | sed -n 's/^Socket(s):[[:space:]]*//p')"
            echo "- nproc: $(nproc)"
            echo "- RAM: $(free -h | awk '/^Mem:/{print $2}')"
            echo "- Disk (work dir): $(df -h . | tail -1)"
            echo "- Kernel: $(uname -r)"
            echo "- OS: $(. /etc/os-release; echo "$PRETTY_NAME")"
            echo "- Runner image: ${ImageOS:-?} ${ImageVersion:-?}; runner name: ${RUNNER_NAME:-?}"
            echo "- Database: $(docker image inspect mysql:8.0 --format '{{index .RepoTags 0}} {{.Id}}' 2>/dev/null)"
            echo "- Container limits (mem/cpu per service):"
            for f in out/paired-benchmark/compose-*-rust.yaml; do [ -f "$f" ] && grep -E 'mem_limit|cpus:' "$f" | sort | uniq -c | sed 's/^/    /' && break; done
            echo "- rust_services: ${{ inputs.rust_services || 'frontend,matching' }}"
          } > out/machine-spec.md 2>&1 || true
          cat out/machine-spec.md
          {
            echo "# Benchmark report ($(git rev-parse --short HEAD))"
            for f in out/paired-benchmark/three-arm-report.md out/three-arm-report.md out/paired-benchmark/comparison-c*.md out/comparison-c*.md; do
              [ -f "$f" ] && { echo; cat "$f"; }
            done
            echo; cat out/machine-spec.md
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          git rev-parse HEAD > out/head-sha.txt
          git status --short > out/worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-matching-paired-benchmark
          path: |
            out/
            !out/cadence-benchmark
            !out/cadence-cli
          retention-days: 3
