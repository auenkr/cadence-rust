name: Matching production validation
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Supported deployment scenario
        type: choice
        options: [postgres, thrift, shard-distributor, configstore, mysql-probes, adaptive, adaptive-single-diagnostic, adaptive-go-control]
        default: postgres
      adaptive_retry_only:
        description: Run a fresh-process workflow-task-retry SDK probe before the full adaptive suite
        type: boolean
        default: false
      adaptive_trace:
        description: Capture bounded adaptive probe delivery and scaler traces
        type: boolean
        default: false
concurrency:
  group: matching-production-validation
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /tmp/cargo-target-final-${{ github.run_id }}
      LANE: ${{ inputs.lane }}
      ADAPTIVE_RETRY_ONLY: ${{ inputs.adaptive_retry_only }}
      CADENCE_MATCHING_ADAPTIVE_TRACE: ${{ inputs.adaptive_trace && 'production-adaptive-scaler-probe' || '' }}
      CADENCE_MATCHING_LIST_PARTITIONS_TRACE: "1"
      CADENCE_MATCHING_SHUTDOWN_TRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init go/idls
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            tests/go-sdk/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Matching diagnostic syntax and observer fixture
        run: |
          set -euo pipefail
          node --check tests/matching-service-compat.cjs
          node --check tests/matching-task-observer.cjs
          node --check tests/matching-task-observer-self-check.cjs
          node --check tests/matching-probe-scenarios.cjs
          node --check tests/matching-adaptive-go-control.cjs
          node --check tests/matching-process-evidence.cjs
          node tests/matching-task-observer-self-check.cjs
      - name: Compile Go SDK mixed Matching fixture
        working-directory: tests/go-sdk
        run: go test -run '^$' .
      - name: PostgreSQL probe client
        if: inputs.lane == 'postgres'
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Build fresh Rust Matching
        if: inputs.lane != 'adaptive-go-control'
        run: |
          mkdir -p out
          git rev-parse HEAD > out/commit.txt
          set +e
          cargo build --manifest-path rust/Cargo.toml -p cadence-matching -j2 > out/build.log 2>&1
          result=$?
          echo "$result" > out/build.exit
          if [ "$result" != 0 ]; then tail -60 out/build.log; exit "$result"; fi
          sha256sum "$CARGO_TARGET_DIR/debug/cadence-matching" > out/binary.sha256
      - name: Probe dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/node-grpc"
          cd "$RUNNER_TEMP/node-grpc"
          npm install @grpc/grpc-js@^1.14.6 @grpc/proto-loader@^0.8.1
          echo "NODE_PATH=$RUNNER_TEMP/node-grpc/node_modules" >> "$GITHUB_ENV"
      - name: Mixed Go and Rust validation
        run: |
          set +e
          mkdir -p out
          git rev-parse HEAD > out/commit.txt
          if [[ "$LANE" == "adaptive-go-control" ]]; then
            export CADENCE_MATCHING_GO_CONTROL=1
            control_args=(--matching-idle-check-seconds 3)
            if [[ "$ADAPTIVE_RETRY_ONLY" == "true" ]]; then control_args+=(--probe-adaptive-retry-only); fi
            printf '%q ' tests/gates/run-mysql-lane.sh out/gate - "${control_args[@]}" > out/command.txt
            tests/gates/run-mysql-lane.sh out/gate - "${control_args[@]}" > out/gate.log 2>&1
            result=$?
            if [ -f out/gate/run/cadence-server ]; then sha256sum out/gate/run/cadence-server > out/go-binary.sha256; fi
            echo "$result" > out/gate.exit
            tail -60 out/gate.log | cut -c1-300
            exit "$result"
          fi
          common=(--matching-restart --matching-failure-recovery --matching-idle-check-seconds 3)
          if [[ "$LANE" == "adaptive-single-diagnostic" ]]; then
            # Diagnostic topology: one Rust Matching process, with the same
            # adaptive SDK/load/routing assertions and process restart as adaptive.
            # The acceptance lane above keeps its two-instance recovery scenario.
            common=(--matching-restart --matching-idle-check-seconds 3)
            printf '%s\n' 'diagnostic-only: adaptive SDK/load/routing with one Rust Matching; Go Frontend/History/Worker; no Go Matching; process restart enabled; two-instance failure recovery omitted' > out/lane.txt
          fi
          wrapper=tests/gates/run-mysql-lane.sh
          case "$LANE" in
            postgres)
              wrapper=tests/gates/run-postgres-lane.sh
              extra=(--probe-pg-gc-domain --probe-query-standby --probe-list-partitions --probe-durable-restart --probe-auto-config-hint) ;;
            thrift) extra=(--matching-transport thrift --history-transport tchannel --probe-auto-config-hint) ;;
            shard-distributor) extra=(--real-shard-distributor) ;;
            configstore) extra=(--matching-configstore) ;;
            mysql-probes) extra=(--matching-backlog-forward --probe-query-standby --probe-list-partitions --probe-durable-restart --probe-auto-config-hint) ;;
            adaptive)
              extra=(--probe-adaptive-scaler)
              if [[ "$ADAPTIVE_RETRY_ONLY" == "true" ]]; then extra+=(--probe-adaptive-retry-only); fi ;;
            adaptive-single-diagnostic)
              extra=(--probe-adaptive-scaler)
              if [[ "$ADAPTIVE_RETRY_ONLY" == "true" ]]; then extra+=(--probe-adaptive-retry-only); fi ;;
            *) exit 2 ;;
          esac
          printf '%q ' "$wrapper" out/gate "$CARGO_TARGET_DIR/debug/cadence-matching" "${common[@]}" "${extra[@]}" > out/command.txt
          "$wrapper" out/gate "$CARGO_TARGET_DIR/debug/cadence-matching" "${common[@]}" "${extra[@]}" > out/gate.log 2>&1
          result=$?
          echo "$result" > out/gate.exit
          tail -60 out/gate.log | cut -c1-300
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matching-production-${{ inputs.lane }}
          # Preserve runtime evidence and binary hashes without storing generated executables.
          path: |
            out/
            !out/**/cadence-server
            !out/**/shard-distributor-real
            !out/**/configstore-seed
          retention-days: 3
