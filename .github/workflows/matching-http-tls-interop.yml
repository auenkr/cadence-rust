name: Matching Go HTTP TLS interop

on:
  workflow_dispatch:

concurrency:
  # Dispatches are independent samples: include run_id so parallel workers never cancel each other.
  group: matching-http-tls-interop-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: cadence
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pcadence"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Initialize Go IDL submodule
        run: git submodule update --init --recursive go && scripts/go-overlay.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            tests/go-sdk/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Select fresh Rust target
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/matching-http-tls-cargo-target" >> "$GITHUB_ENV"
      - name: Record source identity
        run: |
          mkdir -p out/interop
          git rev-parse HEAD > out/source-sha.txt
          printf '%s\n' 'cargo build --locked --manifest-path rust/Cargo.toml -p cadence-server -p cadence-history' > out/build-command.txt
          printf '%s\n' 'python3 tests/run-matching-thrift-compat.py --server-bin "$CARGO_TARGET_DIR/debug/cadence-server" --history-bin "$CARGO_TARGET_DIR/debug/cadence-history" --artifacts-dir out/interop' > out/interop-command.txt
      - name: Build fresh Rust server
        run: |
          set +e
          cargo build --locked --manifest-path rust/Cargo.toml -p cadence-server -p cadence-history > out/build.log 2>&1
          result=$?
          echo "$result" > out/build.exit
          if [ "$result" != 0 ]; then tail -80 out/build.log; exit "$result"; fi
          git diff --binary HEAD -- rust/Cargo.lock > out/cargo-lock.patch
          sha256sum "$CARGO_TARGET_DIR/debug/cadence-server" "$CARGO_TARGET_DIR/debug/cadence-history" > out/binary.sha256
      - name: Create MySQL schema
        run: |
          for db in cadence cadence_visibility; do mysql -h127.0.0.1 -uroot -pcadence -e "CREATE DATABASE IF NOT EXISTS $db"; done
          mysql -h127.0.0.1 -uroot -pcadence cadence < go/schema/mysql/v8/cadence/schema.sql
          mysql -h127.0.0.1 -uroot -pcadence cadence_visibility < go/schema/mysql/v8/visibility/schema.sql
      - name: Run standalone Go HTTP TLS interop
        run: |
          set +e
          python3 tests/run-matching-thrift-compat.py \
            --server-bin "$CARGO_TARGET_DIR/debug/cadence-server" \
            --history-bin "$CARGO_TARGET_DIR/debug/cadence-history" \
            --artifacts-dir "$PWD/out/interop" > out/interop.log 2>&1
          result=$?
          echo "$result" > out/interop.exit
          tail -100 out/interop.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matching-http-tls-interop
          path: |
            out/
            !out/interop/matching-drain.test
          retention-days: 3
