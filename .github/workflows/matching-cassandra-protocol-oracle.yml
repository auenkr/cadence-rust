name: matching-cassandra-protocol-oracle

on:
  workflow_dispatch:
    inputs:
      compare_rust:
        description: "Opt in to the Rust cadence-persistence probe (currently expected to reject protocol 2/3 until driver integration lands)"
        type: boolean
        required: false
        default: false
  push:
    branches: ["matching-*", "t3/matching-cassandra-wire-oracle", "t3/cassandra-protocol-probe"]
    paths:
      - "go/tools/matching-cassandra-protocol-oracle/**"
      - "rust/crates/cadence-persistence/examples/matching_cassandra_protocol_probe.rs"
      - "rust/crates/cadence-persistence/Cargo.toml"
      - ".github/workflows/matching-cassandra-protocol-oracle.yml"

concurrency:
  group: matching-cassandra-protocol-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gocql-backend-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - protocol: 2
            image: cassandra:2.1.22
            expect_range_delete_rejection: true
          - protocol: 3
            image: cassandra:3.11.17
            expect_range_delete_rejection: false
          - protocol: 4
            image: cassandra:4.1.7
            expect_range_delete_rejection: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.compare_rust == true
      - name: Build optional Rust probe before starting Cassandra
        if: inputs.compare_rust == true
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/matching-cassandra-rust-probe"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cassandra-protocol-target"
          test ! -e "$CARGO_TARGET_DIR"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          printf '%s\n' "$CARGO_TARGET_DIR" > "$evidence/target-dir.txt"
          printf 'cargo build --locked -p cadence-persistence --example matching_cassandra_protocol_probe\n' > "$evidence/build-command.txt"
          set +e
          rustfmt --edition 2021 --check rust/crates/cadence-persistence/examples/matching_cassandra_protocol_probe.rs > "$evidence/rustfmt.log" 2>&1
          result=$?
          echo "$result" > "$evidence/rustfmt.exit"
          if [ "$result" -ne 0 ]; then cat "$evidence/rustfmt.log"; exit "$result"; fi
          (cd rust && cargo build --locked -p cadence-persistence --example matching_cassandra_protocol_probe) > "$evidence/build.log" 2>&1
          result=$?
          echo "$result" > "$evidence/build.exit"
          cat "$evidence/build.log"
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          sha256sum "$CARGO_TARGET_DIR/debug/examples/matching_cassandra_protocol_probe" > "$evidence/rust-binary.sha256"
      - name: Start pinned Cassandra server
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --detach --name matching-cassandra-oracle \
            --memory 1800m --memory-swap 1800m --cpus 1.5 --pids-limit 2048 \
            -e MAX_HEAP_SIZE=768M -e HEAP_NEWSIZE=256M \
            -p 127.0.0.1:9042:9042 "$IMAGE"
          ready=0
          for attempt in $(seq 1 120); do
            if docker exec matching-cassandra-oracle cqlsh -e 'DESCRIBE CLUSTER' >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" != 1 ]; then docker logs matching-cassandra-oracle; exit 1; fi
          docker exec matching-cassandra-oracle cqlsh -e \
            "CREATE KEYSPACE cadence_oracle WITH replication = {'class':'SimpleStrategy','replication_factor':1};"
          docker exec matching-cassandra-oracle cqlsh -k cadence_oracle -e \
            "CREATE TABLE queue (queue_type int, message_id bigint, message_payload blob, created_time timestamp, PRIMARY KEY (queue_type, message_id));"
      - name: Run exact pinned Go gocql protocol oracle
        working-directory: go
        env:
          CASSANDRA_HOST: 127.0.0.1
          CASSANDRA_KEYSPACE: cadence_oracle
          CASSANDRA_PROTO_VERSION: ${{ matrix.protocol }}
          CASSANDRA_SERVER_VERSION: ${{ matrix.image }}
          CASSANDRA_EXPECT_RANGE_DELETE_REJECTION: ${{ matrix.expect_range_delete_rejection }}
        run: |
          set -euo pipefail
          test -z "$(gofmt -d tools/matching-cassandra-protocol-oracle/main.go)"
          evidence="$RUNNER_TEMP/matching-cassandra-protocol-oracle"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/head-sha.txt"
          printf 'Cassandra protocol %s against %s; Go module pins gocql v0.0.0-20211015133455-b225f9b53fa1\n' "$CASSANDRA_PROTO_VERSION" "$CASSANDRA_SERVER_VERSION" > "$evidence/contract.txt"
          set +e
          go run ./tools/matching-cassandra-protocol-oracle > "$evidence/oracle.log" 2>&1
          result=$?
          echo "$result" > "$evidence/oracle.exit"
          cat "$evidence/oracle.log"
          exit "$result"
      - name: Run optional Rust public-session protocol probe
        if: inputs.compare_rust == true
        env:
          CASSANDRA_HOST: 127.0.0.1
          CASSANDRA_KEYSPACE: cadence_oracle
          CASSANDRA_PROTO_VERSION: ${{ matrix.protocol }}
          CASSANDRA_SERVER_VERSION: ${{ matrix.image }}
          CASSANDRA_EXPECT_RANGE_DELETE_REJECTION: ${{ matrix.expect_range_delete_rejection }}
        run: |
          set +e
          set -uo pipefail
          evidence="$RUNNER_TEMP/matching-cassandra-rust-probe"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          printf '%s\n' "$RUNNER_TEMP/cassandra-protocol-target/debug/examples/matching_cassandra_protocol_probe" > "$evidence/command.txt"
          printf 'protocol=%s server=%s expect_range_delete_rejection=%s\n' \
            "$CASSANDRA_PROTO_VERSION" "$CASSANDRA_SERVER_VERSION" \
            "$CASSANDRA_EXPECT_RANGE_DELETE_REJECTION" > "$evidence/contract.txt"
          "$RUNNER_TEMP/cassandra-protocol-target/debug/examples/matching_cassandra_protocol_probe" > "$evidence/probe.log" 2>&1
          result=$?
          echo "$result" > "$evidence/probe.exit"
          cat "$evidence/probe.log"
          exit "$result"
      - name: Capture Cassandra server log
        if: always()
        run: docker logs matching-cassandra-oracle > "$RUNNER_TEMP/cassandra-server.log" 2>&1 || true
      - name: Upload Rust protocol probe evidence
        if: always() && inputs.compare_rust == true
        uses: actions/upload-artifact@v4
        with:
          name: matching-cassandra-rust-cql-v${{ matrix.protocol }}-probe
          retention-days: 3
          path: ${{ runner.temp }}/matching-cassandra-rust-probe
      - name: Upload protocol oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-cassandra-cql-v${{ matrix.protocol }}-oracle
          retention-days: 3
          path: |
            ${{ runner.temp }}/matching-cassandra-protocol-oracle
            ${{ runner.temp }}/cassandra-server.log
      - name: Remove Cassandra container
        if: always()
        run: docker rm --force matching-cassandra-oracle || true
