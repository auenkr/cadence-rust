name: SDK service fixed arrival benchmark
on:
  workflow_dispatch:
    inputs:
      fresh_build:
        description: Ignore the cached Rust binaries for this tree and build with --no-cache (final evidence)
        type: boolean
        default: false
      service:
        description: Isolated service to replace
        type: choice
        options: [matching, frontend, history, all]
        default: matching
      source_ref:
        description: Exact migrated source commit (empty uses workflow head)
        default: ''
      rate:
        description: Fixed workflow starts per second
        default: '5'
      duration:
        description: Measurement seconds per arm (smoke default)
        default: '30'
      warmup:
        description: Warmup seconds per arm
        default: '10'
      repetitions:
        description: Fresh-database alternating pairs (fit total inside 90 minutes)
        default: '1'
      profile:
        description: 'perf record Rust services during measurement (1 = on)'
        default: '0'
      repetition_offset:
        description: Starting pair index (odd runs Rust first)
        default: '0'
      mysql_tmpfs:
        description: 'Put MySQL datadir on tmpfs (true) to remove runner disk-fsync variance; same for both arms'
        default: 'false'
      sql_log_secs:
        description: 'Diagnostics: capture MySQL general log for N seconds of the measurement window (0 = off)'
        default: '0'
      history_sql_slow_ms:
        description: 'Diagnostics: Rust History CADENCE_HISTORY_SQL_SLOW_MS (empty = off)'
        default: ''
      sql_stats_secs:
        description: 'Diagnostics: Rust History CADENCE_SQL_STATS_SECS (empty = off)'
        default: ''
      dynamic_config_extra:
        description: 'Extra dynamic config YAML for BOTH arms, \n-separated; replaces same top-level keys (e.g. history.enableTransferQueueV2:\n- value: false)'
        default: ''
concurrency:
  # Dispatches are independent samples: include run_id so parallel workers never cancel each other.
  group: sdk-matching-benchmark-${{ github.ref }}-${{ inputs.service || 'matching' }}-${{ github.run_id }}
  cancel-in-progress: true
jobs:
  service-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: scripts/go-overlay.sh
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: benchmark-source
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: Benchmark/go.mod
          cache-dependency-path: |
            Benchmark/go.sum
            go/go.sum
      - name: Rust binary cache key (rust/ + IDL tree hashes, package, profile)
        id: binkey
        run: |
          src=benchmark-source
          key="bench-bin-v1-${{ inputs.service || 'matching' }}-p${{ inputs.profile || '0' }}-$(git -C $src rev-parse HEAD:rust)-$(git -C $src rev-parse HEAD:go)-$(git -C $src rev-parse HEAD:go-overlay)-$(sha256sum Benchmark/Dockerfile | cut -c1-16)"
          echo "key=$key" >> "$GITHUB_OUTPUT"; echo "$key"
      - uses: actions/cache/restore@v4
        id: bincache
        if: ${{ !inputs.fresh_build }}
        with:
          path: ${{ github.workspace }}/.rust-bin
          key: ${{ steps.binkey.outputs.key }}
      - name: Build and benchmark (all implementation in Benchmark)
        env:
          SERVICE: ${{ inputs.service }}
          BENCHMARK_SOURCE_DIR: ${{ github.workspace }}/benchmark-source
          RUST_BIN_CACHE: ${{ github.workspace }}/.rust-bin
          RATE: ${{ inputs.rate }}
          DURATION: ${{ inputs.duration }}
          WARMUP: ${{ inputs.warmup }}
          REPETITIONS: ${{ inputs.repetitions }}
          REPETITION_OFFSET: ${{ inputs.repetition_offset }}
          PROFILE: ${{ inputs.profile }}
          MYSQL_TMPFS: ${{ inputs.mysql_tmpfs }}
          SQL_LOG_SECS: ${{ inputs.sql_log_secs }}
          CADENCE_HISTORY_SQL_SLOW_MS: ${{ inputs.history_sql_slow_ms }}
          CADENCE_SQL_STATS_SECS: ${{ inputs.sql_stats_secs }}
          DYNAMIC_CONFIG_EXTRA: ${{ inputs.dynamic_config_extra }}
        run: bash Benchmark/ci.sh
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.bincache.outputs.cache-hit != 'true' && hashFiles('.rust-bin/cadence-server') != '' }}
        with:
          path: ${{ github.workspace }}/.rust-bin
          key: ${{ steps.binkey.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-${{ inputs.service || 'matching' }}-benchmark
          path: Benchmark/evidence/run/
          retention-days: 3
