name: Frontend soak (Go baseline vs Rust Frontend+Matching, MySQL)
# TEMPORARY push trigger (branch t3/fe-soak, this file only) so the workflow is dispatchable before it is on
# master. REMOVE the `push:` block after the branch is merged.
on:
  push:
    branches: [t3/fe-soak]
    paths: ['.github/workflows/frontend-soak.yml']
  workflow_dispatch:
    inputs:
      rate:
        description: Workflows started per second (both jobs)
        default: "10"
      duration_minutes:
        description: Soak duration in minutes (Frontend restarts at the halfway point)
        default: "70"
concurrency:
  group: frontend-soak-${{ github.ref }}
  cancel-in-progress: true
env:
  SOAK_RATE: ${{ inputs.rate || '10' }}
  SOAK_MINUTES: ${{ inputs.duration_minutes || '70' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            tests/frontend-soak/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (fresh target dir)
        run: |
          mkdir -p out
          echo "head=$(git rev-parse HEAD)" | tee out/commit.txt
          export CARGO_TARGET_DIR=/tmp/soak-cargo-target
          cargo build --release --manifest-path rust/Cargo.toml -p cadence-server
          cp "$CARGO_TARGET_DIR/release/cadence-server" out/cadence-server
          strip out/cadence-server || true
          (cd go/cmd/server && go build -ldflags='-s -w' -o "$GITHUB_WORKSPACE/out/cadence-go-server" .)
          (cd go && go build -ldflags='-s -w' -o "$GITHUB_WORKSPACE/out/cadence-cli" ./cmd/tools/cli)
          (cd tests/frontend-soak && go build -o "$GITHUB_WORKSPACE/out/frontend-soak-driver" .)
          sha256sum out/* | tee out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: soak-binaries
          path: out/
          retention-days: 3
  soak:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [go-baseline, rust]
    name: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: soak-binaries
          path: bin
      - name: Soak
        run: |
          chmod +x bin/*
          M=${{ matrix.mode == 'rust' && 'rust' || 'go' }}
          export SOAK_SECONDS=$((SOAK_MINUTES * 60))
          export SOAK_RESTART_AT=$((SOAK_SECONDS / 2))
          mkdir -p res
          set +e
          tests/gates/run-frontend-soak-lane.sh res/lane --mode "$M" \
            --rust-binary "$PWD/bin/cadence-server" --go-server "$PWD/bin/cadence-go-server" \
            --go-cli "$PWD/bin/cadence-cli" --driver "$PWD/bin/frontend-soak-driver" \
            --rust-root "$PWD" > res/gate.log 2>&1
          echo $? > res/gate.exit
          echo "lane exit $(cat res/gate.exit)"; tail -n 80 res/gate.log | cut -c1-300
          mkdir -p res/up/logs; tail -n 300 res/gate.log > res/up/gate-tail.log
          python3 tests/gates/soak-analyze.py run --dir res/lane/run --label "${{ matrix.mode }}" \
            --restart-at "$SOAK_RESTART_AT" --out res/analysis || true
          cp res/analysis/* res/up/ 2>/dev/null; cp res/lane/run/{steps.json,summary.json,soak-driver.log,rust-binary.sha256} res/up/ 2>/dev/null || true
          cp bin/SHA256SUMS bin/commit.txt res/up/
          for f in res/lane/run/*.log; do [ -f "$f" ] && tail -n 300 "$f" > "res/up/logs/$(basename "$f")"; done
          test -f res/analysis/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.mode }}
          path: res/up/
          retention-days: 3
  compare:
    needs: soak
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: soak-*
          path: art
      - run: |
          python3 tests/gates/soak-analyze.py compare --go art/soak-go-baseline --rust art/soak-rust --out verdict.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-verdict
          path: verdict.md
          retention-days: 3
