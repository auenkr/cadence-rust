name: History swap (Go History <-> Rust History on one database)

on:
  # push trigger on the work branch: a new dispatch-only workflow cannot be dispatched before it exists on master.
  push:
    branches: [history-swap]
    paths: ['.github/workflows/history-swap.yml', 'tests/history-swap/**', 'tests/gates/run-history-swap.py']
  workflow_dispatch:
    inputs:
      database:
        description: Persistence lane
        type: choice
        options: [mysql, postgres, cassandra]
        default: mysql
      outbound:
        description: Rust service outbound transport
        type: choice
        options: [grpc, tchannel]
        default: grpc

concurrency:
  group: history-swap-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(github.event_name == 'push' && '["mysql","postgres","cassandra"]' || format('["{0}"]', inputs.database)) }}
    name: swap-${{ matrix.database }}
    env:
      OUTBOUND: ${{ inputs.outbound || 'grpc' }}
      CARGO_TARGET_DIR: /tmp/cadence-history-swap-${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            tests/history-swap/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate harness syntax and record source identity
        run: |
          mkdir -p out
          git rev-parse HEAD > out/head-sha.txt
          python3 -m py_compile tests/gates/run-history-swap.py
          bash -n tests/gates/run-frontend-${{ matrix.database }}-lane.sh
      - name: Build Rust services in fresh target directory
        run: |
          set +e
          cargo build --manifest-path rust/Cargo.toml -p cadence-server -p cadence-history > out/cargo-build.log 2>&1
          result=$?
          echo "$result" > out/cargo-build.exit
          tail -40 out/cargo-build.log
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          sha256sum "$CARGO_TARGET_DIR/debug/cadence-server" "$CARGO_TARGET_DIR/debug/cadence-history" > out/rust-binaries.sha256
          cat out/rust-binaries.sha256
      - name: Build Go server, CLI and swap driver
        run: |
          (cd go && go build -p 2 -ldflags='-s -w' -o "$GITHUB_WORKSPACE/out/cadence-go-server" ./cmd/server)
          (cd go && go build -p 2 -ldflags='-s -w' -o "$GITHUB_WORKSPACE/out/cadence-cli" ./cmd/tools/cli)
          (cd tests/history-swap && go build -o "$GITHUB_WORKSPACE/out/history-swap-driver" .)
      - name: Swap History implementation mid-workflow
        env:
          CADENCE_GATE_SCRIPT: run-history-swap.py
          RUST_BACKTRACE: 1
          RUST_LOG: warn
        run: |
          set +e
          tests/gates/run-frontend-${{ matrix.database }}-lane.sh out/gate \
            --rust-binary "$CARGO_TARGET_DIR/debug/cadence-server" \
            --rust-history-binary "$CARGO_TARGET_DIR/debug/cadence-history" \
            --go-server "$GITHUB_WORKSPACE/out/cadence-go-server" \
            --go-cli "$GITHUB_WORKSPACE/out/cadence-cli" \
            --driver "$GITHUB_WORKSPACE/out/history-swap-driver" \
            --rust-root "$GITHUB_WORKSPACE" \
            --rust-outbound "$OUTBOUND" > out/gate.log 2>&1
          result=$?
          echo "$result" > out/gate.exit
          tail -80 out/gate.log | cut -c1-300
          mkdir -p out/up/logs
          for f in out/gate/run/*.log; do [ -f "$f" ] && tail -n 400 "$f" > "out/up/logs/$(basename "$f")"; done
          cp out/gate/run/{steps.json,summary.json,swap-result.json,rust-binary.sha256,rust-history-binary.sha256} out/up/ 2>/dev/null || true
          cp out/gate/run/ctl/dump-*.json out/up/ 2>/dev/null || true
          cp out/head-sha.txt out/rust-binaries.sha256 out/gate.exit out/up/
          exit "$result"
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: history-swap-${{ matrix.database }}
          retention-days: 3
          path: out/up/
