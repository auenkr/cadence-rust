name: Matching DescribeTaskList Go oracle

on:
  workflow_dispatch:

concurrency:
  group: matching-describe-tasklist-go-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Initialize Go IDL submodule
        run: git submodule update --init go/idls
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Record and run original Go handler and engine oracle
        run: |
          mkdir -p out
          git rev-parse HEAD > out/source-sha.txt
          printf '%s\n' 'go test -overlay $RUNNER_TEMP/describe-tasklist-overlay.json ./service/matching/handler -run ^TestMatchingEngineSuite/TestMalformedDescribeTaskListOracle$ -count=1 -v' > out/command.txt
          cat > "$RUNNER_TEMP/describe-tasklist-overlay.json" <<EOF
          {"Replace":{"$GITHUB_WORKSPACE/go/service/matching/handler/describe_tasklist_oracle_test.go":"$GITHUB_WORKSPACE/tests/go-matching-describe-tasklist-oracle_test.go"}}
          EOF
          cp "$RUNNER_TEMP/describe-tasklist-overlay.json" out/overlay.json
          set +e
          go test -overlay "$RUNNER_TEMP/describe-tasklist-overlay.json" ./service/matching/handler \
            -run '^TestMatchingEngineSuite/TestMalformedDescribeTaskListOracle$' -count=1 -v \
            > out/go-oracle.log 2>&1
          result=$?
          echo "$result" > out/go-oracle.exit
          cat out/go-oracle.log
          exit "$result"
        working-directory: go
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matching-describe-tasklist-go-oracle
          path: go/out/
          retention-days: 3
