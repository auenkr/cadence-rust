persistence:
  defaultStore: cass-default
  visibilityStore: cass-visibility
  numHistoryShards: 4
  datastores:
    cass-default:
      nosql:
        pluginName: "cassandra"
        hosts: "127.0.0.1"
        keyspace: "cadence"
        connectTimeout: 2s # defaults to 2s if not defined
        timeout: 5s # defaults to 10s if not defined
        consistency: LOCAL_QUORUM # default value
        serialConsistency: LOCAL_SERIAL # default value
    cass-visibility:
      nosql:
        pluginName: "cassandra"
        hosts: "127.0.0.1"
        keyspace: "cadence_visibility"

ringpop:
  name: cadence
  bootstrapMode: hosts
  bootstrapHosts: [ "127.0.0.1:41273", "127.0.0.1:37689", "127.0.0.1:37563" ]
  maxJoinDuration: 30s

services:
  frontend:
    rpc:
      port: 41273
      grpcPort: 49317
      bindOnLocalHost: true
      grpcMaxMsgSize: 33554432
    metrics:
      statsd:
        hostPort: "127.0.0.1:8125"
        prefix: "cadence"
    pprof:
      port: 46323

  matching:
    rpc:
      port: 43969
      grpcPort: 39101
      bindOnLocalHost: true
      grpcMaxMsgSize: 33554432
    metrics:
      statsd:
        hostPort: "127.0.0.1:8125"
        prefix: "cadence"
    pprof:
      port: 58791

  history:
    rpc:
      port: 37689
      grpcPort: 45565
      bindOnLocalHost: true
      grpcMaxMsgSize: 33554432
    metrics:
      statsd:
        hostPort: "127.0.0.1:8125"
        prefix: "cadence"
    pprof:
      port: 42305

  worker:
    rpc:
      port: 37563
      bindOnLocalHost: true
    metrics:
      statsd:
        hostPort: "127.0.0.1:8125"
        prefix: "cadence"
    pprof:
      port: 33697

clusterGroupMetadata:
  failoverVersionIncrement: 10
  primaryClusterName: "cluster0"
  currentClusterName: "cluster0"
  clusterGroup:
    cluster0:
      enabled: true
      initialFailoverVersion: 0
      newInitialFailoverVersion: 1 # migrating to this new failover version
      rpcAddress: "localhost:49317" # this is to let worker service and XDC replicator connected to the frontend service. In cluster setup, localhost will not work
      rpcTransport: "grpc"

dcRedirectionPolicy:
  policy: "noop"
  toDC: ""

archival:
  history:
    status: "enabled"
    enableRead: true
    provider:
      filestore:
        fileMode: "0666"
        dirMode: "0766"
      gstorage:
        credentialsPath: "/tmp/gcloud/keyfile.json"
  visibility:
    status: "enabled"
    enableRead: true
    provider:
      filestore:
        fileMode: "0666"
        dirMode: "0766"

domainDefaults:
  archival:
    history:
      status: "enabled"
      URI: "file:///tmp/matching-telemetry-prometheus-retry/history-archive"
    visibility:
      status: "enabled"
      URI: "file:///tmp/matching-telemetry-prometheus-retry/visibility-archive"

dynamicconfig:
  client: filebased
  configstore:
    pollInterval: "10s"
    updateRetryAttempts: 2
    FetchTimeout: "2s"
    UpdateTimeout: "2s"
  filebased:
    filepath: "/tmp/matching-telemetry-prometheus-retry/dynamic-config.yaml"
    pollInterval: "10s"

blobstore:
  filestore:
    outputDirectory: "/tmp/matching-telemetry-prometheus-retry/blobstore"

shardDistributorClient:
  hostPort: "localhost:7943"

shard-distributor-matching:
  namespaces:
    - namespace: cadence-matching-dev
      heartbeat_interval: 1s
      ttl_shard: 5m
      ttl_report: 1m
