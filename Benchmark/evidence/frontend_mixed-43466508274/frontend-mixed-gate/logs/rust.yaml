persistence:
  defaultStore: mysql-default
  visibilityStore: mysql-visibility
  numHistoryShards: 4
  datastores:
    mysql-default:
      sql:
        pluginName: mysql
        databaseName: "cadence"
        connectAddr: "127.0.0.1:3306"
        connectProtocol: tcp
        user: "root"
        password: "cadence"
        nShards: 1
        maxConns: 20
        maxIdleConns: 20
    mysql-visibility:
      sql:
        pluginName: mysql
        databaseName: "cadence_visibility"
        connectAddr: "127.0.0.1:3306"
        connectProtocol: tcp
        user: "root"
        password: "cadence"
        nShards: 1
        maxConns: 2
        maxIdleConns: 2
ringpop:
  name: cadence
  bootstrapMode: hosts
  bootstrapHosts: ["127.0.0.1:20388", "127.0.0.1:20815", "127.0.0.1:12291", "127.0.0.1:13398"]
  maxJoinDuration: 30s

services:
  frontend:
    rpc:
      port: 20388
      grpcPort: 11626
      bindOnLocalHost: true
      grpcMaxMsgSize: 33554432
    metrics:
      prometheus:
        timerType: histogram
        listenAddress: "127.0.0.1:58991"
    pprof:
      port: 15353

  matching:
    rpc:
      port: 12793
      grpcPort: 17110
      bindOnLocalHost: true
      grpcMaxMsgSize: 33554432
    metrics:
      statsd:
        hostPort: "127.0.0.1:8125"
        prefix: "cadence"
    pprof:
      port: 11781

  history:
    rpc:
      port: 20815
      grpcPort: 18249
      bindOnLocalHost: true
      grpcMaxMsgSize: 33554432
    metrics:
      statsd:
        hostPort: "127.0.0.1:8125"
        prefix: "cadence"
    pprof:
      port: 26488

  worker:
    rpc:
      port: 12291
      bindOnLocalHost: true
    metrics:
      statsd:
        hostPort: "127.0.0.1:8125"
        prefix: "cadence"
    pprof:
      port: 15884

clusterGroupMetadata:
  failoverVersionIncrement: 10
  primaryClusterName: "cluster0"
  currentClusterName: "cluster0"
  clusterGroup:
    cluster0:
      enabled: true
      initialFailoverVersion: 0
      newInitialFailoverVersion: 1 # migrating to this new failover version
      rpcAddress: "127.0.0.1:11626" # this is to let worker service and XDC replicator connected to the frontend service. In cluster setup, localhost will not work
      rpcTransport: "grpc"

dcRedirectionPolicy:
  policy: "noop"
  toDC: ""

archival:
  history:
    status: "enabled"
    enableRead: true
    provider:
      filestore:
        fileMode: "0666"
        dirMode: "0766"
      gstorage:
        credentialsPath: "/tmp/gcloud/keyfile.json"
  visibility:
    status: "enabled"
    enableRead: true
    provider:
      filestore:
        fileMode: "0666"
        dirMode: "0766"

domainDefaults:
  archival:
    history:
      status: "enabled"
      URI: "file:///home/runner/work/cadence-rust/cadence-rust/out/gate/run/history-archive"
    visibility:
      status: "enabled"
      URI: "file:///home/runner/work/cadence-rust/cadence-rust/out/gate/run/visibility-archive"

dynamicconfig:
  client: filebased
  configstore:
    pollInterval: "10s"
    updateRetryAttempts: 2
    FetchTimeout: "2s"
    UpdateTimeout: "2s"
  filebased:
    filepath: "/home/runner/work/cadence-rust/cadence-rust/out/gate/run/rust-dynamic-config.yaml"
    pollInterval: "10s"

blobstore:
  filestore:
    outputDirectory: "/home/runner/work/cadence-rust/cadence-rust/out/gate/run/blobstore"

shardDistributorClient:
  hostPort: "localhost:7943"

shard-distributor-matching:
  namespaces:
    - namespace: cadence-matching-dev
      heartbeat_interval: 1s
      ttl_shard: 5m
      ttl_report: 1m
histograms:
  default: both

asyncWorkflowQueues:
  gate-async-queue:
    type: "kafka"
    config:
      connection:
        brokers:
          - "127.0.0.1:19092"
      topic: "cadence-async-gate"
authorization:
  oauthAuthorizer:
    enable: true
    maxJwtTTL: 3600
    jwtCredentials:
      algorithm: "RS256"
      publicKey: "/home/runner/work/cadence-rust/cadence-rust/out/gate/run/oauth/public.pem"
